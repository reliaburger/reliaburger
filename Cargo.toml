[package]
name = "reliaburger"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "A batteries-included container orchestrator"

[lib]
name = "reliaburger"
path = "src/lib.rs"

[[bin]]
name = "bun"
path = "src/bin/bun.rs"

[[bin]]
name = "relish"
path = "src/bin/relish.rs"

[[bin]]
name = "testapp"
path = "src/bin/testapp.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive"] }
nix = { version = "0.29", features = ["signal", "process", "user", "sched", "net", "fs"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
semver = "1"
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = "0.7"
toml = "0.8"
oci-distribution = { version = "0.11", default-features = false, features = ["rustls-tls"] }
flate2 = "1"
tar = "0.4"
sha2 = "0.10"
siphasher = "1"
hex = "0.4"
dirs = "6"
tokio-stream = "0.1"
futures-util = "0.3"
crossterm = { version = "0.28", features = ["event-stream"] }
ratatui = "0.29"
tokio-tungstenite = "0.28"
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
bincode = "1"
redb = "2"
rustls = { version = "0.23", features = ["ring"] }
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
# rcgen's validity fields are `time::OffsetDateTime`; the direct dependency
# lets us set exact timestamped windows instead of calendar dates (PKI6).
time = "0.3"
ring = "0.17"
rustls-pemfile = "2"
x509-parser = { version = "0.16", features = ["verify"] }
pem = "3"
argon2 = "0.5"
age = { version = "0.10", features = ["armor"] }
base64 = "0.22"
datafusion = "45"
object_store = { version = "0.12", features = ["fs", "aws", "gcp"] }
url = "2"
sysinfo = "0.33"
prometheus-parse = "0.2"
rust-embed = "8"
mime_guess = "2"
k8s-openapi = { version = "0.22", default-features = false, features = ["latest"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "service"] }
hyper = { version = "1", features = ["http1"] }
tower = "0.5"

[target.'cfg(target_os = "linux")'.dependencies]
aya = { version = "0.13", optional = true }
aya-log = { version = "0.2", optional = true }
libc = "0.2"

[features]
default = ["kubernetes"]
kubernetes = ["dep:k8s-openapi"]
ebpf = ["aya", "aya-log"]

[dev-dependencies]
criterion = { version = "0.5", features = ["async_tokio"] }
http-body-util = "0.1"
insta = { version = "1", features = ["json"] }
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"

# Content-addressed storage verifies a SHA-256 on every blob write and
# read-back; unoptimised SHA-256 runs at ~30 MB/s and dominates the
# image-transfer tests (100 MB P2P pull). Optimise just the hash
# crates — everything else keeps fast debug builds.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.dev.package.block-buffer]
opt-level = 3

[profile.test.package.sha2]
opt-level = 3

[profile.test.package.digest]
opt-level = 3

[profile.test.package.block-buffer]
opt-level = 3

[[bench]]
name = "gossip"
harness = false

[[bench]]
name = "gossip_large"
harness = false
