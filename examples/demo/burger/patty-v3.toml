# The tour's automatic rollback: burger.toml's patty at VERSION v3, a raw
# patty whose health check always fails, and nothing else changed.
#
#   relish apply burger/patty-v3.toml
#   relish status
#   relish history patty
#
# The new instance never turns healthy, so it never joins the service map and
# the burger keeps its v1 patty. After health_timeout (20 s) the node gives up,
# puts v1 back (auto_rollback is on by default) and the cluster marks patty
# RolloutFailed until its spec changes again.

[app.patty]
image = "burger:v1"
port = 8080
cpu = "10m-200m"
memory = "8Mi-32Mi"
env = { LAYER = "patty", VERSION = "v3" }
metrics = {}

[app.patty.health]
path = "/healthz"
interval = 2
timeout = 1
threshold_unhealthy = 2

[app.patty.deploy]
health_timeout = "20s"
drain_timeout = "5s"
