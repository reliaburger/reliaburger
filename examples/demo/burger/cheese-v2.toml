# The tour's rolling deploy: burger.toml's cheese at VERSION v2, blue cheese
# instead of cheddar, and nothing else changed.
#
#   relish apply burger/cheese-v2.toml
#   curl http://burger.localhost:18080
#
# Cheese runs two replicas. The node replaces them one at a time: it starts a
# v2 instance beside the v1 ones (max_surge 1), waits for it to pass its
# health check, then drains a v1, and goes again. The other slice keeps
# serving meanwhile, so the burger never loses its cheese; it turns from
# cheddar to blue cheese a slice at a time.

[app.cheese]
image = "burger:v1"
port = 8080
replicas = 2
cpu = "10m-200m"
memory = "8Mi-32Mi"
env = { LAYER = "cheese", VERSION = "v2" }
metrics = {}

[app.cheese.health]
path = "/healthz"
interval = 2
timeout = 1
threshold_unhealthy = 2

[app.cheese.deploy]
health_timeout = "20s"
drain_timeout = "5s"
