# Two slices: the rolling deploy swaps them one at a time, so the burger
# never loses its cheese.
[app.cheese]
image = "burger:v1"
port = 8080
replicas = 2
cpu = "10m-200m"
memory = "8Mi-32Mi"
env = { LAYER = "cheese", VERSION = "v1" }
metrics = {}

[app.cheese.health]
path = "/healthz"
