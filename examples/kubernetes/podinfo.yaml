# podinfo in its three-tier shape: a frontend that calls a backend and caches
# in redis, reached through an ingress, plus a small load generator. Apply it
# as it is:
#
#   relish apply -f examples/kubernetes/podinfo.yaml
#   curl -H 'Host: podinfo.localhost' http://127.0.0.1/
#
# Modelled on upstream github.com/stefanprodan/podinfo, deploy/webapp/
# (frontend, backend) and deploy/bases/cache (redis). The edits a real
# migration to Reliaburger needed, and nothing else:
#
#  1. Images are pinned by digest, and redis comes from the ECR mirror of the
#     official image (public.ecr.aws/docker/library) to avoid Docker Hub rate
#     limits: podinfo 6.15.0, redis 8.8.0.
#  2. No `namespace: webapp` and no `serviceAccountName`: the demo runs in
#     `default`, and workload identity replaces service accounts.
#  3. Readiness and liveness probes are `httpGet` on /readyz and /healthz
#     instead of `exec: podcli check http ...`. Only HTTP readiness probes
#     import; liveness probes are reported and not imported.
#  4. The frontend runs 3 replicas (upstream: 1, scaled by an HPA we leave
#     out) and gets `--cache-server=tcp://redis:6379`.
#  5. The cache is named `redis` rather than `cache`, and its configMap and
#     emptyDir volumes become arguments: `--maxmemory 64mb --maxmemory-policy
#     allkeys-lru --save "" --appendonly no` (upstream's redis.conf). With no
#     `command`, the image's own entrypoint runs, exactly as in Kubernetes.
#  6. An Ingress routes host podinfo.localhost to the frontend.
#  7. A `loadgen` Deployment (not in upstream) keeps traffic flowing so the
#     metrics and faults in the tour have something to act on. It's a
#     BusyBox shell loop, pinned by digest like the rest, that calls the
#     frontend by service name several times a second: the home page, an
#     echo the frontend forwards to the backend, then a write and a read of
#     /cache/loadgen, which go through to redis. Four calls per loop, not
#     three, so the three frontends take turns at every kind of request. A
#     failed request is ignored and the loop carries on, so it keeps going
#     through every fault you inject.
#
# The `prometheus.io/*` annotations import as `metrics = { port = 9797 }`:
# each node scrapes podinfo's metrics listener on its own instances, so
# `relish metrics frontend` works with no Prometheus install.
#
# What the import reports rather than keeps: the frontend Service's port 80
# (clients inside the cluster use frontend:9898; the ingress is unaffected),
# the backend's gRPC port, the liveness probes, and redis's tcpSocket and
# exec probes.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
  minReadySeconds: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    rollingUpdate:
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ghcr.io/stefanprodan/podinfo@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9898
          protocol: TCP
        - name: http-metrics
          containerPort: 9797
          protocol: TCP
        command:
        - ./podinfo
        - --port=9898
        - --port-metrics=9797
        - --level=info
        - --backend-url=http://backend:9898/echo
        - --cache-server=tcp://redis:6379
        env:
        - name: PODINFO_UI_COLOR
          value: "#34577c"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
spec:
  rules:
  - host: podinfo.localhost
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  minReadySeconds: 3
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 60
  strategy:
    rollingUpdate:
      maxUnavailable: 0
    type: RollingUpdate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9797"
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: ghcr.io/stefanprodan/podinfo@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9898
          protocol: TCP
        - name: http-metrics
          containerPort: 9797
          protocol: TCP
        - name: grpc
          containerPort: 9999
          protocol: TCP
        command:
        - ./podinfo
        - --port=9898
        - --port-metrics=9797
        - --grpc-port=9999
        - --grpc-service-name=backend
        - --level=info
        env:
        - name: PODINFO_UI_COLOR
          value: "#34577c"
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 5
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 9898
      protocol: TCP
      targetPort: http
    - port: 9999
      targetPort: grpc
      protocol: TCP
      name: grpc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: public.ecr.aws/docker/library/redis@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b
          imagePullPolicy: IfNotPresent
          args:
            - redis-server
            - --maxmemory
            - 64mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            timeoutSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      protocol: TCP
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  selector:
    matchLabels:
      app: loadgen
  template:
    metadata:
      labels:
        app: loadgen
    spec:
      containers:
        - name: loadgen
          image: public.ecr.aws/docker/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                wget -q -T 5 -O /dev/null http://frontend:9898/
                wget -q -T 5 -O /dev/null --post-data loadgen http://frontend:9898/api/echo
                wget -q -T 5 -O /dev/null --post-data "$(date)" http://frontend:9898/cache/loadgen
                wget -q -T 5 -O /dev/null http://frontend:9898/cache/loadgen
                sleep 0.5
              done
          resources:
            limits:
              cpu: 100m
              memory: 16Mi
            requests:
              cpu: 10m
              memory: 8Mi
