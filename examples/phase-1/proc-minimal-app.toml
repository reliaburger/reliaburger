# Minimal app configuration for Phase 1.
#
# Build first:
#   cargo build
#
# Deploy with:
#   cargo run --bin bun -- --runtime process
#   cargo run --bin relish -- apply examples/phase-1/proc-minimal-app.toml
#
# Add --dry-run to preview the plan without an agent; a plain apply with
# no agent prints the plan and fails, because nothing was deployed.

[app.web]
# ProcessGrill (`--runtime process`, or what `--runtime auto` picks when
# runc isn't available) records the image field but ignores it: the
# command below is what actually runs on the host.
image = "proc-grill:image-ignored"
command = ["target/debug/testapp", "--mode", "healthy", "--port", "8080"]
port = 8080

[app.web.health]
path = "/healthz"
interval = 5
timeout = 2
threshold_unhealthy = 3
threshold_healthy = 1

[app.worker]
# A worker with no health check — transitions straight to Running.
image = "proc-grill:image-ignored"
command = ["target/debug/testapp", "--mode", "healthy", "--port", "9090"]
