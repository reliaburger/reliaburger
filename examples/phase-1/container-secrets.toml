# Real container: an encrypted secret in the environment.
#
# DB_PASSWORD below is an ENC[AGE:...] value: ciphertext you can commit. The
# node that starts the job decrypts it into the job's environment, and the
# job prints how long it is, never the value.
#
# The value shipped here is encrypted to a throwaway key that no cluster
# has, so as it stands your node refuses to start the job ("can't decrypt")
# rather than pass ciphertext through. Encrypt your own value with your
# cluster's public key and paste it in place of the one below:
#
#   relish secret encrypt --pubkey "$(relish secret pubkey)" 'correct horse battery staple'
#
# `secret encrypt` never contacts the cluster; `secret pubkey` asks it for
# its current key (or give it the directory `relish init` wrote).
#
# Requires runc on Linux (on macOS, use the managed Linux VM from
# `relish setup --quickstart`).
#
# Deploy with:
#   relish apply examples/phase-1/container-secrets.toml
#   relish logs secret-check      # DB_PASSWORD has 28 characters

[job.secret-check]
image = "public.ecr.aws/docker/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
command = ["/bin/sh", "-c", "echo \"DB_PASSWORD has ${#DB_PASSWORD} characters\""]

[job.secret-check.env]
DB_PASSWORD = "ENC[AGE:]"
