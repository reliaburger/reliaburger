# Multiple apps in a single config file (process-runtime version).
#
# All three apps deploy together and run testapp on different ports.
# See container-multi-app.toml for the real-runtime version with OCI images.
#
# Build first:
#   cargo build
#
# Start Bun with the process runtime and the node config that allows
# testapp, from the repository root:
#   target/debug/bun --runtime process --config examples/node/process-runtime.toml
#
# Deploy with:
#   cargo run --bin relish -- apply examples/phase-1/proc-multi-app.toml

[app.web]
exec = "target/debug/testapp"
command = ["--mode", "healthy", "--port", "8080"]
port = 8080
replicas = 2

[app.web.health]
path = "/"

[app.api]
exec = "target/debug/testapp"
command = ["--mode", "healthy", "--port", "3000"]
port = 3000
replicas = 2

[app.api.env]
NODE_ENV = "production"

[app.api.health]
path = "/healthz"

[app.worker]
exec = "target/debug/testapp"
command = ["--mode", "healthy", "--port", "9090"]
