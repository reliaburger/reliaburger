# Volume mounts example.
#
# Two modes:
#   - HostPath: specify `source` to bind-mount a host directory directly.
#               The node refuses it unless its node.toml lists a covering
#               prefix in `[storage] allowed_host_paths`, e.g.
#               allowed_host_paths = ["/var/www"], and a token with a
#               [permission] block also needs `host-exec`.
#   - Managed:  omit `source` and Reliaburger picks a directory under
#               storage.volumes/{namespace}/{app}/{path}.
#
# This config is designed for runc (on macOS, the managed Linux VM from
# `relish setup --quickstart`). Volumes need a container runtime: the
# process runtime refuses image apps, and host `exec`/`script` apps can't
# mount volumes, so there's no process-runtime version of this example.
#
# Deploy with a real runtime:
#   cargo run --bin bun -- --runtime runc
#   cargo run --bin relish -- apply examples/phase-1/container-volumes.toml

[app.redis]
image = "redis:7-alpine"
port = 6379

# Managed volume — Reliaburger creates the host directory automatically.
[[app.redis.volumes]]
path = "/data"
size = "10Gi"

[app.nginx]
image = "nginx:latest"
port = 8080

# HostPath volume — bind-mount a specific host directory. Bun never
# chowns it (nginx only reads here); a container that must write needs
# the directory owned by its mapped host uid, 2000000000 + container uid.
[[app.nginx.volumes]]
source = "/var/www/html"
path = "/usr/share/nginx/html"
