# Example: batch job submission.
#
# A finite batch admits up to 64 named jobs in one Raft entry. Each job
# becomes a one-task run on the same lifecycle as task arrays: the leader
# hands tasks to nodes with room for their CPU and memory requests, and
# each node runs them under its own concurrency cap.
#
# Each job can set its own run policy, using the manifest's field names:
# max_attempts, task_timeout_secs and replay_unknown.
#
# Submit: relish batch examples/phase-8/batch-jobs.toml
# relish prints an idempotency key first. If the submission times out,
# retry with --idempotency-key KEY to get the same runs back.

[job.etl-chunk-0]
image = "etl-worker:v3"
command = ["process", "--chunk", "0", "--total", "100"]
cpu = "100m-200m"
memory = "128Mi-256Mi"
namespace = "batch"
task_timeout_secs = 900

[job.etl-chunk-1]
image = "etl-worker:v3"
command = ["process", "--chunk", "1", "--total", "100"]
cpu = "100m-200m"
memory = "128Mi-256Mi"
namespace = "batch"

[job.etl-chunk-2]
image = "etl-worker:v3"
command = ["process", "--chunk", "2", "--total", "100"]
cpu = "100m-200m"
memory = "128Mi-256Mi"
namespace = "batch"
