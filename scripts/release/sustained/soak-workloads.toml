# Workloads for the V02 sustained soak (scripts/release/qualify-sustained.sh).
#
# The writer and the soak Redis keep their data on managed volumes. Placement
# isn't volume-aware, so each is pinned by a node label the harness adds to
# node.toml: `soak-volume = "writer"` on node 2 and `"redis"` on node 3. An app
# that moved would start on an empty volume and look like data loss.
#
# Every app gets a workload identity; soak-identity runs one instance per node
# so the harness can read a certificate on each node through `relish exec`.
# The harness bumps SOAK_GENERATION to drive a rolling deploy.
#
# Images are the pinned ones from src/testkit/pinned_images.rs.

# Policies (#1311): a deny, a warn and a default. The soak applies this file
# at the start and again at every generation, including the deploy-kill
# slot's apply with a node SIGKILLed under it, so policy evaluation runs
# under faults. Each matches only the soak's own workloads: the catalogue
# pulse's `relish test` apps and the podinfo demo must pass as they always
# have. None of them refuses a soak workload (tests/suite/
# platform_policies.rs checks that), and every check makes sure they're
# still in force (sustained_check.py, `policies`). Apply runs off the agent
# loop, so the turn budget shouldn't move with them; the soak checks that it
# doesn't.
[policy.soak-pinned-images]
applies_to = "both"
match = "workload.name.startsWith('soak-') && has(workload.image)"
deny = "!workload.image.contains('@sha256:')"
message = "soak images are pinned by digest (src/testkit/pinned_images.rs)"

[policy.soak-memory-limits]
action = "warn"
match = "app.name.startsWith('soak-')"
deny = "!has(app.memory)"
message = "soak apps run without a memory limit"

[policy.soak-team]
match = "app.name.startsWith('soak-')"

[policy.soak-team.default]
env.SOAK_TEAM = "soak"

# Appends 1, 2, 3, ... to /data/seq about ten times a second, syncs, then logs
# `ACK n`. On start it drops a torn last line (a power cut mid-append) and
# carries on from the last whole one, so the file must always hold 1..N with
# N at least the highest ACK ever logged.
#
# The file alone can't show a loss after a power cut: by the time the checks
# read it again the writer has appended past the lost lines, and 1..N is whole
# again. So each start first appends where it resumed to /data/resumes and
# syncs it, and the checker requires every start to resume at or past the
# highest ACK logged before it (the power-cut endurance harness's approach,
# scripts/release/power_cut/workloads.toml).
[app.soak-writer]
image = "public.ecr.aws/docker/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
command = ["/bin/sh", "-c", '''
trap 'exit 0' TERM
f=/data/seq
touch "$f"
lines=$(wc -l < "$f")
head -n "$lines" "$f" > "$f.tmp" && mv "$f.tmp" "$f" && sync
n=$(tail -n 1 "$f")
echo "RESUME ${n:-0} after $lines lines"
n=${n:-0}
r=/data/resumes
touch "$r"
starts=$(wc -l < "$r")
head -n "$starts" "$r" > "$r.tmp" && mv "$r.tmp" "$r"
echo "$n" >> "$r"
sync
while true; do
  n=$((n + 1))
  echo "$n" >> "$f"
  sync
  echo "ACK $n"
  sleep 0.1
done
''']

[[app.soak-writer.volumes]]
path = "/data"
size = "256Mi"

[app.soak-writer.placement]
required = ["soak-volume=writer"]

# Redis with an append-only file synced on every write. `command` skips the
# image's entrypoint, which drops to the redis user; on the 0.1.0 candidate
# that user can't write the managed volume (see the V02 plan's findings).
[app.soak-redis]
image = "public.ecr.aws/docker/library/redis@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b"
command = ["redis-server", "--dir", "/data", "--appendonly", "yes", "--appendfsync", "always"]
port = 6379

[[app.soak-redis.volumes]]
path = "/data"
size = "256Mi"

[app.soak-redis.placement]
required = ["soak-volume=redis"]

# INCR once a second, logging `INCR n`. The counter must never go backwards.
# Like the writer's file, the counter after a settle can't show a loss: the
# client has counted past it. So before its first INCR each start pushes the
# counter it found onto soak:starts, which must be at or past the highest INCR
# logged before it. The client usually runs on another node than Redis and
# lives through a cut of Redis's node, so it also pushes `LAST NOW` onto
# soak:regressions whenever an INCR answers no more than the one before; any
# entry there is a loss. Both lists live in Redis, written after it is back.
[app.soak-redis-client]
image = "public.ecr.aws/docker/library/redis@sha256:234c902a2db49461a129e2d4aeff85b28cf20187ed274a67f6e50995fa713c7b"
command = ["/bin/sh", "-c", '''
trap 'exit 0' TERM
# Before the first INCR: record the counter as this start found it.
until start=$(redis-cli -h soak-redis -p 6379 GET soak:counter 2>&1) \
  && case $start in ''|*[!0-9]*) [ -z "$start" ] ;; *) true ;; esac \
  && pushed=$(redis-cli -h soak-redis -p 6379 RPUSH soak:starts "${start:-0}" 2>&1) \
  && case $pushed in ''|*[!0-9]*) false ;; *) true ;; esac; do
  echo "ERR start $start $pushed"
  sleep 1
done
echo "START ${start:-0}"
last=${start:-0}
while true; do
  v=$(redis-cli -h soak-redis -p 6379 INCR soak:counter 2>&1)
  case $v in
    ''|*[!0-9]*) echo "ERR $v" ;;
    *)
      echo "INCR $v"
      if [ "$v" -le "$last" ]; then
        echo "BACK $last $v"
        until pushed=$(redis-cli -h soak-redis -p 6379 RPUSH soak:regressions "$last $v" 2>&1) \
          && case $pushed in ''|*[!0-9]*) false ;; *) true ;; esac; do
          echo "ERR regression $pushed"
          sleep 1
        done
      fi
      last=$v
      ;;
  esac
  sleep 1
done
''']

# About 200 log lines a second, to keep Ketchup's exporter and pruning busy.
[app.soak-spammer]
image = "public.ecr.aws/docker/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
command = ["/bin/sh", "-c", '''
trap 'exit 0' TERM
i=0
while true; do
  j=0
  while [ $j -lt 20 ]; do
    i=$((i + 1))
    echo "spam $i the quick brown fox jumps over the lazy dog"
    j=$((j + 1))
  done
  sleep 0.1
done
''']

# One instance per node, idle, so each node has a workload certificate to read.
[app.soak-identity]
image = "public.ecr.aws/docker/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
command = ["/bin/sh", "-c", "trap 'exit 0' TERM; while true; do sleep 1; done"]
replicas = "*"
env = { SOAK_GENERATION = "0" }

# The latency SLOs' rolling update (#1400). Outside fault windows, about
# twice a cycle, the harness bumps SOAK_SLO_GENERATION and times the apply
# (an API write), each node's new instance until its health check passes
# (app start) and the whole rollout (deploy-to-ready). It is its own app so
# the rollouts never touch soak-identity's certificate rotations or the data
# apps. `sh` stays PID 1 so SIGTERM stops it at once. It serves a file it
# writes itself (the container's root is a private writable layer), so the
# health check never depends on what the image ships.
[app.soak-slo]
image = "public.ecr.aws/docker/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
command = ["/bin/sh", "-c", "trap 'exit 0' TERM; mkdir -p /srv/soak-slo; echo ok > /srv/soak-slo/health; /bin/busybox httpd -f -p 8080 -h /srv/soak-slo & wait"]
port = 8080
replicas = "*"
env = { SOAK_SLO_GENERATION = "0" }

[app.soak-slo.health]
path = "/health"
interval = 1
timeout = 1
