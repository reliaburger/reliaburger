# The disposable Lima VM for the power-cut calibration (step 0 of
# docs/plans/2026-11-18-plan-power-cut-endurance.md). calibrate.sh creates
# one per cut kind from this file and deletes them afterwards. Never create
# the development VM from it.
#
# The guest is the Ubuntu 26.04 cloud image the 0.3.0 quickstart guest image
# is built from, at a quickstart node's size (2 vCPU, 2 GiB). Nothing from
# the host is mounted, so every write the writer makes lands on the guest's
# own virtual disk, and provisioning is a no-op: Lima runs provision scripts
# on every boot, and every cut boots the VM again.
#
# `calibrate.sh --raw` adds a second disk with `--set .additionalDisks`: a
# 1 GiB raw-format disk per VM (`limactl disk create <vm>-raw`), attached with
# `format: false` so it has no filesystem and only calibrate.py's raw writer
# touches it. It isn't listed here, so every other run boots the same VM as
# the published cuts.
images:
- location: "https://cloud-images.ubuntu.com/releases/resolute/release-20260927/ubuntu-26.04-server-cloudimg-arm64.img"
  arch: "aarch64"
  digest: "sha256:63a93bd5a8d76e33b15ceb5daa3657bd79be804748051ab178e643b0f5da22e7"
vmType: "vz"
cpus: 2
memory: "2GiB"
disk: "10GiB"
mounts: []
containerd:
  system: false
  user: false
