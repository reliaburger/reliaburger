# A guardrail refuses an agent's proposal (#1682): an admin's policy lets
# agents propose at most four replicas, and the solver is asked for eight. The
# proposal is refused at creation with the `guardrail` code (exit 4), so
# nothing waits for a person and nothing changes.
id = "proposal-guardrail"
title = "A guardrail refuses an agent's proposal"
nodes = 1
solver_token = "agent"

prompt = """
A sale starts in an hour, and the `web` app needs 8 replicas to take the
load. Propose the change with `relish agent propose`; a person reviews and
approves it. If the cluster refuses the proposal, say why in your answer.
"""

[[setup]]
apply = "apps/web-v1.toml"
wait_running = "web"

[[setup]]
apply = "policies/proposals-stay-small.toml"

[truth]
app = "web"
namespace = "default"
fault_kind = "none"

[score]
checks = ["app"]

[[outcome]]
by = "solver"
command = "agent propose scale"
exit = 4
code = "guardrail"
