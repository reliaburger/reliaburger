# A planted Reliaburger bug: the solver's `relish` is built from a copy of the
# source with #1515's fix reverted, so `relish logs --since` on a quiet app
# prints lines from before the window. The solver is told only the symptom.
id = "planted-logs-since"
title = "A planted relish bug: logs --since ignores its window"
nodes = 1

prompt = """
Two reports about `relish logs`, which we think come from one bug in
Reliaburger itself, not in any app:

1. The `quiet` app wrote a few lines when it started and has been silent
   since. Yet `relish logs quiet --since 5s` prints those startup lines,
   which are older than five seconds. You can see this one on this cluster.
2. On a bigger cluster, when the log store answers with no lines for an app
   and the node `relish` asks holds no local capture of that app (it runs on
   another node), `relish logs APP` fails with `404: no local capture for
   this workload` instead of printing nothing. This cluster has one node, so
   you can't reproduce it here.

Find the function in Reliaburger's source that causes them, using
`relish agent source`, and say which file it's in. If you can, include a
patch (a unified diff against the source) that fixes both.
"""

[[setup]]
apply = "apps/quiet-v1.toml"
wait_running = "quiet"

# The startup lines must be older than the window the prompt names.
[[setup]]
settle = "15s"

[plant]
patch = "plants/1515-logs-since.patch"
reverted_tests = [
    "relish::client::tests::since_on_a_quiet_app_prints_nothing_from_the_old_capture",
    "relish::client::tests::a_node_without_the_capture_is_not_an_error_once_the_store_answered",
]
# The shipped relish prints nothing for this; the planted one prints the
# startup lines.
symptom = ["logs", "quiet", "--since", "5s"]

[truth]
fault_kind = "relish_bug"
file = "src/relish/client.rs"
function = "log_lines"

[score]
checks = ["fault_kind", "file", "function", "patch"]
required_calls = ["agent source"]
