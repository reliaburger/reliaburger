# The Reliaburger appliance: Ubuntu 26.04 LTS with bun as its only service.
# Built in CI by .github/workflows/appliance.yml, one native build per
# architecture. See docs/plans/2026-09-28-plan-appliance-image.md.

[Distribution]
Distribution=ubuntu
Release=resolute
# universe carries systemd-repart, which mkosi's default initrd needs. It's
# built from the same systemd source as the main packages, so it gets the
# same updates.
Repositories=main,universe

[Output]
ImageId=reliaburger-os
OutputDirectory=mkosi.output
Format=disk
CompressOutput=zstd
# The UKI and the /usr partition images are what an A/B update writes, so
# keep them as separate files too.
SplitArtifacts=uki,partitions
ManifestFormat=json

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=unsigned
# reliaburger-os_<version>.efi on the ESP, the name sysupdate matches when it
# adds the next version beside it (mkosi.extra/usr/lib/reliaburger/sysupdate.d).
UnifiedKernelImageFormat=%i_%v
WithDocs=no
Hostname=reliaburger
Locale=C.UTF-8
Timezone=UTC
# Locked root: no console login, and systemd-firstboot has nothing to ask on
# a headless first boot.
RootPassword=hashed:!*
# Ubuntu's generic kernel (Canonical-patched). linux-image-generic depends on
# the linux-firmware metapackage, which linux-firmware-minimal also provides;
# listing it keeps the multi-hundred-megabyte full firmware set out of the
# image. Only the Wyse 3040's NIC firmware is added here (and its graphics
# firmware on x86-64, in mkosi.conf.d).
# - systemd-boot brings systemd-bless-boot (boot counting), and
#   systemd-container brings systemd-sysupdate (A/B updates).
# - systemd-zram-generator gives 2 GB machines compressed swap in RAM.
# - openssh-server is for the spike's lab only: it starts only when the lab
#   passes an ssh.authorized_keys.root credential (see the ssh.*.d drop-ins).
# - The last six packages are the node packages, kept equal to
#   scripts/release/guest-images.json.
Packages=
        linux-image-generic
        linux-firmware-minimal
        linux-firmware-realtek
        systemd
        systemd-boot-efi
        systemd-boot
        systemd-container
        systemd-resolved
        systemd-timesyncd
        systemd-zram-generator
        udev
        dbus
        kmod
        tar
        gzip
        openssh-server
        ca-certificates
        curl
        runc
        uidmap
        btrfs-progs
        nftables
        iptables
        iproute2

# The initrd only has to find and mount the disk: virtio (VMs), NVMe and
# AHCI (mini PCs), eMMC (the Wyse 3040), USB sticks, and the filesystems and
# dm-verity the image uses, plus DMI and fw_cfg so PID 1 can import the
# spike's seed credential (reliaburger-seed.service). mkosi's default list pulled in enough modules and
# firmware to make a 200+ MB UKI.
KernelInitrdModules=
        /drivers/virtio/
        /drivers/block/virtio_blk
        /drivers/scsi/virtio_scsi
        /drivers/scsi/sd_mod
        /drivers/nvme/host/
        /drivers/ata/ahci
        /drivers/ata/libahci
        /drivers/mmc/
        /drivers/usb/storage/
        /drivers/usb/host/
        /drivers/md/dm-mod
        /drivers/md/dm-verity
        /drivers/firmware/dmi-sysfs
        /drivers/firmware/qemu_fw_cfg
        /fs/ext4/
        /fs/btrfs/
        /fs/erofs/
        /fs/fat/
        /fs/nls/nls_cp437
        /fs/nls/nls_iso8859-1

# Each node makes its own SSH host keys on first start (ssh.service.d).
RemoveFiles=/etc/ssh/ssh_host_*

[Validation]
Checksum=yes

[Build]
# mkosi builds its own pinned tools (systemd-repart, ukify, ...) instead of
# using the runner's older systemd.
ToolsTree=yes
