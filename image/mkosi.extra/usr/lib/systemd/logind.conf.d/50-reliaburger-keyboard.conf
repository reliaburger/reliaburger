# No gettys on tty2-tty6 (#2279). tty1 is reliaburger-console.service, the
# node's status screen, and root is locked, so a login prompt on another VT
# gives nobody a shell; it only invites someone at the keyboard to try.
#
# NAutoVTs=0 stops logind starting autovt@ on a VT someone switches to, and
# ReserveVT=0 stops it keeping tty6 for one. Ubuntu's getty-static.service,
# which starts getty@tty2-6 when logind isn't around, is masked in
# /etc/systemd/system. Alt-F2 still switches VT; the screen is just blank.
[Login]
NAutoVTs=0
ReserveVT=0
