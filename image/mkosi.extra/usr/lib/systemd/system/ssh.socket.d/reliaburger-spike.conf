# Spike lab only (S3/S4): sshd listens only when the VM was started with an
# ssh.authorized_keys.root credential, which systemd's provision.conf turns
# into /root/.ssh/authorized_keys. Without it the appliance has no login.
# Phase 1 drops this: bun stages OS updates itself.
[Unit]
ConditionCredential=ssh.authorized_keys.root
