# Spike only: sshd listens only when the operator asked for it, either with
# an ssh.authorized_keys.root credential (the lab; systemd's provision.conf
# turns it into /root/.ssh/authorized_keys) or with an authorized_keys file
# in the node's seed (real machines; apply-seed installs it). Without either
# the appliance has no login. Phase 1 drops this: bun stages OS updates.
[Unit]
ConditionCredential=|ssh.authorized_keys.root
ConditionPathExists=|/root/.ssh/authorized_keys
