# The lab image only (the `lab` profile has sshd): sshd listens only when
# asked, either with an ssh.authorized_keys.root credential (systemd's
# provision.conf turns it into /root/.ssh/authorized_keys) or with an
# authorized_keys file in the node's seed (`bun appliance prepare` installs
# it). Published images have no sshd at all.
[Unit]
ConditionCredential=|ssh.authorized_keys.root
ConditionPathExists=|/root/.ssh/authorized_keys
