# The journal shares the data partition with Raft, images and volumes: about
# 4.5 GiB on a Wyse 3040's 8 GB eMMC. bun keeps its own logs and metrics, so
# the journal only has to explain the last few boots.
[Journal]
SystemMaxUse=32M
RuntimeMaxUse=16M
# reliaburger-netlog gives the boot units StandardOutput=kmsg when
# streaming (#2149). journald forwards only up to MaxLevelKMsg= to the
# kernel log, notice by default, and their lines are info. Nothing else
# forwards to the kernel log (ForwardToKMsg=no), so nothing else changes.
MaxLevelKMsg=info
