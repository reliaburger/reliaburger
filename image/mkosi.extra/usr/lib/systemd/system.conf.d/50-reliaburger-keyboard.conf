# Ctrl-Alt-Del does nothing on the appliance (#2279). ctrl-alt-del.target is
# masked in /etc/systemd/system, but PID 1 has a second path: seven presses
# within two seconds run CtrlAltDelBurstAction=, a forced reboot by default,
# whatever the target is. The power button still shuts the node down
# cleanly.
[Manager]
CtrlAltDelBurstAction=none
