# Dell Wyse 3040 (Atom x5-Z8350, Cherry Trail): the HSUART DMA driver hangs
# reboot and shutdown, which would stall every A/B update. Workaround from
# https://wiki.debian.org/InstallingDebianOn/Dell/Wyse%203040 ; spike S5
# checks whether Linux 7.0 still needs it. Harmless on other machines.
install dw_dmac /bin/true
install dw_dmac_core /bin/true
