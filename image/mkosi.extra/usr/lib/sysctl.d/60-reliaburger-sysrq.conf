# Magic SysRq on the appliance (#2279): sync (16), remount read-only (32) and
# reboot or power off (128), and nothing else. Alt-SysRq-S, -U, then -B is
# the cleanest way to restart a node whose userspace has hung: there's no
# login to do it from, and the alternative is pulling the plug on a Btrfs
# data partition. Anyone at the keyboard can already power the machine off,
# so the reboot gives them nothing new. The rest stays off: killing
# processes (64, it could kill bun), dumping tasks and memory onto the screen
# (8), keyboard control (4) and the console log level (2).
#
# 60- so it comes after systemd's 50-default.conf and procps'
# 10-magic-sysrq.conf, which set their own values.
kernel.sysrq = 176
