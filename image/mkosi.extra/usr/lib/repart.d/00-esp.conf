# First-boot layout, applied by systemd-repart in the initrd (which reads
# /sysusr/usr/lib/repart.d, i.e. this directory in slot A of /usr). The first four
# files match the partitions the image ships (ESP, slot A of /usr and its
# verity, the data partition); the last two add the empty slot B that
# systemd-sysupdate writes updates into. Sizes match mkosi.repart/ so an
# update fits either slot.
[Partition]
Type=esp
SizeMinBytes=512M
SizeMaxBytes=512M
