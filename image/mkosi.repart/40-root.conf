# The writable partition: /etc, /var and bun's /var/lib/reliaburger, on Btrfs
# (bun prefers it for volumes). Ubuntu keeps configuration in /etc (the
# linker paths, alternatives, certificates), so the image ships it here
# rather than building /etc from nothing on first boot. It grows to fill
# the disk on first boot (see mkosi.initrd.conf/).
[Partition]
Type=root
Label=reliaburger-data
Format=btrfs
CopyFiles=/:/
ExcludeFiles=/usr/
MakeDirectories=/usr /var/lib/reliaburger
Minimize=guess
GrowFileSystem=yes
