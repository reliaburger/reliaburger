# Build-time layout: the ESP, slot A of /usr with its verity hashes, and the
# writable data partition. On first boot systemd-repart in the initrd grows
# the data partition and adds an empty slot B (mkosi.extra/usr/lib/repart.d).
#
# The ESP holds systemd-boot and two UKIs (A and B); 512 MiB is the Wyse
# 3040 budget (research §9.3).
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
SizeMinBytes=512M
SizeMaxBytes=512M
