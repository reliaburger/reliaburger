# Build-time layout: ESP plus slot A of /usr and its verity hashes. The
# writable data partition and slot B are created on first boot by
# systemd-repart in the initrd (mkosi.initrd.conf/mkosi.extra/usr/lib/repart.d).
#
# The ESP holds systemd-boot and two UKIs (A and B); 512 MiB is the Wyse
# 3040 budget (research §9.3).
[Partition]
Type=esp
Format=vfat
CopyFiles=/efi:/
CopyFiles=/boot:/
SizeMinBytes=512M
SizeMaxBytes=512M
