[Match]
Architecture=x86-64

[Content]
# The serial console is what the CI boot test reads.
# The data partition (Btrfs, the root): no access-time writes, and light
# compression to cut the bytes written to eMMC.
KernelCommandLine=console=tty0 console=ttyS0,115200 rootflags=noatime,compress=zstd:1
# The Wyse 3040's Atom (Cherry Trail) needs i915 firmware for its console.
Packages=linux-firmware-intel-graphics
