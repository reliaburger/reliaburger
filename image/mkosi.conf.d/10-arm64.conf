[Match]
Architecture=arm64

[Content]
# QEMU's virt machine exposes its serial console as a PL011 UART.
# The data partition (Btrfs, the root): no access-time writes, and light
# compression to cut the bytes written to eMMC.
KernelCommandLine=console=tty0 console=ttyAMA0,115200 rootflags=noatime,compress=zstd:1
