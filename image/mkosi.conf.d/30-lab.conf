# The lab's image (`mkosi --profile lab`), which pull-request builds and the
# hardware lab use: openssh-server, for debugging a lab machine. bun runs OS
# updates itself since W6, so SSH isn't needed for anything else. sshd starts
# only when the lab passes an ssh.authorized_keys.root credential (the
# ssh.*.d drop-ins). Published images never have it.
[Match]
Profiles=lab

[Content]
Packages=openssh-server
