# The QEMU lab's image (`mkosi --profile lab`; pull-request builds use it):
# openssh-server, so the lab can stage OS updates by hand until bun does it
# (W6). sshd starts only when the lab passes an ssh.authorized_keys.root
# credential (the ssh.*.d drop-ins). Published images never have it.
[Match]
Profiles=lab

[Content]
Packages=openssh-server
