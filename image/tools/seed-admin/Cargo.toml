# Preview helpers for seeding appliance nodes (image/tools/seed-fleet.sh and
# the lab): seed-admin adds a hashed admin token to a `relish init` security
# bootstrap, as quickstart does; check-config loads a node.toml the way bun
# does. Phase 1's bare-metal `relish` replaces them. Not part of the repo's
# workspace.
[package]
name = "seed-admin"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
reliaburger = { path = "../../..", default-features = false }
serde_json = "1"

[workspace]
