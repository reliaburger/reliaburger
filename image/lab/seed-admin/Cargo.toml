# Spike-only helpers for the lab (image/lab/README.md): seed-admin adds a
# hashed admin token to a `relish init` security bootstrap, check-config
# loads a node.toml the way bun does. Not part of the repo's workspace.
[package]
name = "seed-admin"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
reliaburger = { path = "../../..", default-features = false }
serde_json = "1"

[workspace]
