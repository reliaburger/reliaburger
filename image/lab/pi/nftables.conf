#!/usr/sbin/nft -f
# The Wyse lab's router firewall. Installed on the Raspberry Pi as
# /etc/nftables.conf (README.md).
#
# The lab switch (eth0) gets DHCP, DNS, NTP and SSH from the Pi, and NAT out
# through the uplink. Nothing is open on the uplink, and nothing from the
# uplink reaches the lab. If the uplink is a USB Ethernet adapter instead of
# Wi-Fi, set WAN to its name (usually eth1).

flush ruleset

define LAN = "eth0"
define WAN = "wlan0"

table inet filter {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif "lo" accept
		# DNS, DHCP and NTP for the lab, and SSH to manage the Pi.
		iifname $LAN udp dport { 53, 67, 123 } accept
		iifname $LAN tcp dport { 22, 53 } accept
		iifname $LAN icmp type echo-request accept
		# IPv6 needs neighbour discovery to work at all.
		meta l4proto ipv6-icmp accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
		ct state established,related accept
		iifname $LAN oifname $WAN accept
	}

	chain output {
		type filter hook output priority filter; policy accept;
	}
}

table ip nat {
	chain postrouting {
		type nat hook postrouting priority srcnat; policy accept;
		oifname $WAN masquerade
	}
}
