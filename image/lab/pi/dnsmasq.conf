# The Wyse lab's router: DHCP, DNS and the NTP option on the lab switch.
# Installed on the Raspberry Pi as /etc/dnsmasq.d/lab.conf (README.md).
#
# Addresses only. This file has NO boot options: no dhcp-boot, no
# pxe-service, no enable-tftp, no option 66 or 67. `relish netboot` on the
# Mac is the ProxyDHCP that answers PXE, and before it starts it probes the
# LAN and refuses to run if another *boot* server answers
# (NetbootError::CompetingServer). A plain DHCP offer is fine; a boot file
# in it is not. It's the split CI tests in image/tests/relish-netboot-install.sh:
# dnsmasq hands out addresses and knows nothing about booting.
# image/tests/test_pi_router.py fails if a boot option appears here.

# Only the lab switch. Never serve DHCP on wlan0, the home network.
# bind-dynamic rather than CI's bind-interfaces: if the Pi boots before the
# switch, eth0 has no address yet, and dnsmasq picks it up when it gets one.
interface=eth0
bind-dynamic

# The pool for anything without a reservation. The reserved addresses (.2,
# and .11 to .20) sit below it.
dhcp-range=10.77.0.100,10.77.0.199,255.255.255.0,12h
dhcp-authoritative

# The Pi is the default route, the DNS server and the time server. The nodes
# need the route: bun finds its advertise address from the default-route
# interface. systemd-timesyncd on the nodes takes the NTP server from option
# 42, which matters on a Wyse with a flat RTC battery.
dhcp-option=option:router,10.77.0.1
dhcp-option=option:dns-server,10.77.0.1
dhcp-option=option:ntp-server,10.77.0.1

# Names in the lab: wyse-1.lab and so on resolve to their reservations.
domain=lab
local=/lab/
host-record=pi.lab,pi,10.77.0.1

log-dhcp

# Reservations. Each node must get the same address every time, because the
# claim records each machine's current address as its node address. Copy
# each Wyse's MAC from the label underneath it (aa:bb:cc:dd:ee:ff), then
# remove the `#`.
#dhcp-host=<wyse-1-mac>,10.77.0.11,wyse-1
#dhcp-host=<wyse-2-mac>,10.77.0.12,wyse-2
#dhcp-host=<wyse-3-mac>,10.77.0.13,wyse-3
#dhcp-host=<wyse-4-mac>,10.77.0.14,wyse-4
#dhcp-host=<wyse-5-mac>,10.77.0.15,wyse-5
#dhcp-host=<wyse-6-mac>,10.77.0.16,wyse-6
#dhcp-host=<wyse-7-mac>,10.77.0.17,wyse-7
#dhcp-host=<wyse-8-mac>,10.77.0.18,wyse-8
#dhcp-host=<wyse-9-mac>,10.77.0.19,wyse-9
#dhcp-host=<wyse-10-mac>,10.77.0.20,wyse-10

# The Mac's USB Ethernet adapter: a fixed address (the --operator address
# the claim uses) and no default route, so the Mac's internet stays on its
# Wi-Fi. A tagged option overrides the untagged one above, and an option
# with no value sends none.
#dhcp-host=<mac-adapter-mac>,10.77.0.2,mac,set:operator
dhcp-option=tag:operator,option:router

# The Pi itself has a static address on eth0 (10.77.0.1) and takes no lease;
# the host-record above gives it a name.
