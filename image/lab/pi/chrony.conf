# The Wyse lab's time server. Installed on the Raspberry Pi as
# /etc/chrony/chrony.conf (README.md); installing chrony replaces
# systemd-timesyncd.
#
# The Pi takes its time from the internet through the uplink and serves it
# to the lab. The nodes find it through DHCP option 42 (dnsmasq.conf).

pool 2.debian.pool.ntp.org iburst

driftfile /var/lib/chrony/chrony.drift
# Step the clock on the first updates after boot: a Pi 4 has no RTC, so it
# starts with roughly the time it shut down with.
makestep 1 3
rtcsync
leapsectz right/UTC

# Serve the lab, and nobody else.
allow 10.77.0.0/24

# No `local stratum` line on purpose: an unsynchronised Pi tells its clients
# so, rather than serving a clock that may be days out.
