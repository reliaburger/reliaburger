# Netboot server: ProxyDHCP + TFTP only, never hands out addresses. netns "nb", eth0 = 192.168.105.2
port=0
interface=eth0
bind-interfaces
dhcp-range=192.168.105.0,proxy,255.255.255.0
dhcp-leasefile=/var/lib/misc/l2lab-proxy.leases
enable-tftp
tftp-root=/srv/tftp
dhcp-userclass=set:ipxe,iPXE
pxe-prompt="Reliaburger netboot",0
pxe-service=tag:!ipxe,ARM64_EFI,"Reliaburger iPXE arm64",ipxe-arm64.efi
pxe-service=tag:!ipxe,X86-64_EFI,"Reliaburger iPXE x86_64",ipxe-x86_64.efi
# Some x86-64 firmware reports EFI BC (option 93 value 9, not 7).
pxe-service=tag:!ipxe,BC_EFI,"Reliaburger iPXE x86_64",ipxe-x86_64.efi
# iPXE itself (user class iPXE): hand it a script, never the iPXE binary again (no loop)
pxe-service=tag:ipxe,ARM64_EFI,"Reliaburger script",boot.ipxe
pxe-service=tag:ipxe,X86-64_EFI,"Reliaburger script",boot.ipxe
pxe-service=tag:ipxe,BC_EFI,"Reliaburger script",boot.ipxe
log-dhcp
log-facility=-
