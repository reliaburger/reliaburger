# "Home router": addresses only, no boot options. Root netns, br0 = 192.168.105.1
port=0
interface=br0
bind-interfaces
dhcp-range=192.168.105.100,192.168.105.199,255.255.255.0,1h
dhcp-option=option:router,192.168.105.1
dhcp-option=option:dns-server,10.0.2.3
dhcp-authoritative
dhcp-leasefile=/var/lib/misc/l2lab-router.leases
log-dhcp
log-facility=-
# Fixed addresses for the lab's client MACs, like DHCP reservations on a home
# router: bun's bootstrap_peers need literal IPs.
dhcp-host=52:54:00:00:01:01,192.168.105.101
dhcp-host=52:54:00:00:01:02,192.168.105.102
dhcp-host=52:54:00:00:01:03,192.168.105.103
dhcp-host=52:54:00:00:01:04,192.168.105.104
dhcp-host=52:54:00:00:01:05,192.168.105.105
dhcp-host=52:54:00:00:01:06,192.168.105.106
dhcp-host=52:54:00:00:01:07,192.168.105.107
dhcp-host=52:54:00:00:01:08,192.168.105.108
