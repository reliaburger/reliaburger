# The isolated Wyse lab's DHCP server, on the Mac that also runs
# `relish netboot --mode-dhcp-proxy`. Run it as README.md says:
#
#   sudo "$(brew --prefix)/sbin/dnsmasq" --keep-in-foreground \
#       --conf-file=image/lab/mac/dnsmasq.conf
#
# It hands out the addresses on the lab switch, and with option 60
# `PXEClient` it tells PXE firmware and iPXE to ask for the boot part on UDP
# 4011 of this same machine (PXE specification 2.1, section 2.2.4). relish
# answers there; dnsmasq owns UDP 67. So this file has no boot file, no TFTP
# and no pxe-service: relish does all of that. CI runs this file, with its
# own interface and subnet, in image/tests/relish-netboot-install.sh, and
# image/tests/test_mac_router.py checks it.

# Only the lab's USB Ethernet adapter. Never the Wi-Fi: that's the home
# network. Change en7 if `networksetup -listallhardwareports` names the
# adapter differently.
interface=en7
bind-interfaces

# No DNS server on the Mac: the nodes get public resolvers below, so
# nothing here needs port 53.
port=0

# The pool for anything without a reservation. The reserved addresses (.11
# to .20) sit below it, and the Mac itself is .1, set by hand.
dhcp-range=10.77.0.100,10.77.0.199,255.255.255.0,12h
dhcp-authoritative

# The Mac is the default route: pf NATs the lab out through its Wi-Fi
# (pf-lab.conf). The nodes need the route, because bun finds its advertise
# address from the default-route interface.
dhcp-option=option:router,10.77.0.1
# Public resolvers. Put your home router's address here instead if your
# network blocks them. Time comes from Ubuntu's NTP servers through the NAT.
dhcp-option=option:dns-server,1.1.1.1,9.9.9.9

# PXE firmware and iPXE identify themselves with vendor class PXEClient.
# Only they get option 60 back, which sends them to this machine's UDP 4011
# for the boot file. Without it, the firmware never asks relish anything.
dhcp-vendorclass=set:pxe,PXEClient
dhcp-option-force=tag:pxe,60,PXEClient

log-dhcp

# Reservations. Each node must get the same address every time, because the
# claim records each machine's current address as its node address. Copy
# each Wyse's MAC from the label underneath it (aa:bb:cc:dd:ee:ff), then
# remove the `#`. An infinite lease keeps a node's address even while
# dnsmasq isn't running.
#dhcp-host=<wyse-1-mac>,10.77.0.11,wyse-1,infinite
#dhcp-host=<wyse-2-mac>,10.77.0.12,wyse-2,infinite
#dhcp-host=<wyse-3-mac>,10.77.0.13,wyse-3,infinite
#dhcp-host=<wyse-4-mac>,10.77.0.14,wyse-4,infinite
#dhcp-host=<wyse-5-mac>,10.77.0.15,wyse-5,infinite
#dhcp-host=<wyse-6-mac>,10.77.0.16,wyse-6,infinite
#dhcp-host=<wyse-7-mac>,10.77.0.17,wyse-7,infinite
#dhcp-host=<wyse-8-mac>,10.77.0.18,wyse-8,infinite
#dhcp-host=<wyse-9-mac>,10.77.0.19,wyse-9,infinite
#dhcp-host=<wyse-10-mac>,10.77.0.20,wyse-10,infinite
