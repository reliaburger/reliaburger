# NAT for the isolated Wyse lab: the lab subnet out through the Mac's Wi-Fi.
# macOS's own /etc/pf.conf already has `nat-anchor "com.apple/*"`, so this
# loads into an anchor beneath it and leaves the system's rules alone
# (README.md):
#
#   sudo pfctl -a com.apple/reliaburger-lab -f image/lab/mac/pf-lab.conf
#
# Change en0 if the Wi-Fi is another interface (`route -n get default`).
wifi = "en0"
lab = "10.77.0.0/24"

nat on $wifi inet from $lab to any -> ($wifi)
