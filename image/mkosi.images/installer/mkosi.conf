# The netboot installer: a UKI whose initrd is a small Ubuntu system that
# streams the signed disk image onto the node's disk and reboots into it
# (research §4.7, spike S2). iPXE fetches it over HTTP and passes the image
# URL on the command line; see image/netboot/.
#
# A subimage inherits only ImageId=, ImageVersion= and the universal
# settings (distribution, release, repositories, tools tree) from
# image/mkosi.conf, so everything else is spelled out here.

[Output]
ImageId=reliaburger-os-installer
# A subimage's output is otherwise named after its directory (installer_*).
Output=%i_%v
Format=uki
# The initrd is the whole installer system; compress it.
CompressOutput=zstd

[Content]
WithDocs=no
Hostname=reliaburger-installer
Locale=C.UTF-8
Timezone=UTC
RootPassword=hashed:!*
# The installer runs from RAM, so it carries only what streaming needs:
# networking, curl, zstd, openssl for the Ed25519 check, and the partition
# tools. The kernel is the same as the image's, unwrapped by the same
# finalize script.
Packages=
        linux-image-generic
        linux-firmware-minimal
        linux-firmware-realtek
        systemd
        systemd-boot-efi
        udev
        kmod
        curl
        ca-certificates
        zstd
        openssl
        util-linux
        fdisk
        gdisk
FinalizeScripts=../../mkosi.finalize

# Disks and NICs: virtio (VMs), NVMe and AHCI (mini PCs), eMMC (the Wyse
# 3040), USB, and the Wyse's Realtek NIC. mkosi adds module dependencies
# and only the firmware those modules need.
KernelModules=
        /drivers/virtio/
        /drivers/block/virtio_blk
        /drivers/net/virtio_net
        /drivers/scsi/virtio_scsi
        /drivers/scsi/sd_mod
        /drivers/nvme/host/
        /drivers/ata/ahci
        /drivers/ata/libahci
        /drivers/mmc/
        /drivers/usb/storage/
        /drivers/usb/host/
        /drivers/net/ethernet/realtek/
        /drivers/net/usb/
        /fs/efivarfs/

[Validation]
Checksum=yes
