# The netboot installer: a UKI whose initrd is a small Ubuntu system that
# streams the signed disk image onto the node's disk and reboots into it
# (research §4.7, spike S2). iPXE fetches it over HTTP and passes the image
# URL on the command line; see image/netboot/.
#
# A subimage inherits only ImageId=, ImageVersion= and the universal
# settings (distribution, release, repositories, tools tree) from
# image/mkosi.conf, so everything else is spelled out here.

[Output]
ImageId=reliaburger-os-installer
# A subimage's output is otherwise named after its directory (installer_*).
Output=%i_%v
Format=uki
# The initrd is the whole installer system; compress it.
CompressOutput=zstd

[Content]
WithDocs=no
Hostname=reliaburger-installer
Locale=C.UTF-8
Timezone=UTC
RootPassword=hashed:!*
# The installer runs from RAM, so it carries only what streaming needs:
# networking, curl, zstd, openssl for the Ed25519 check, the partition tools
# and efibootmgr. The kernel is the same as the image's, unwrapped by the same
# postinst script.
Packages=
        linux-image-generic
        linux-firmware-minimal
        linux-firmware-realtek
        systemd
        systemd-boot-efi
        udev
        kmod
        curl
        ca-certificates
        zstd
        openssl
        util-linux
        fdisk
        gdisk
        efibootmgr
        iproute2
PostInstallationScripts=../../mkosi.postinst

# Disks and NICs: virtio (VMs), NVMe and AHCI (mini PCs), eMMC (the Wyse
# 3040), USB, and the wired NICs mini PCs and thin clients carry: Realtek
# (the Wyse's RTL8111 and the RTL8125), Intel (e1000e's I219, igc's
# I225/I226, igb, and e1000 for QEMU) and Broadcom's tg3. mkosi adds hard
# module dependencies and only the firmware those modules need, but not
# soft ones: r8169 needs the Realtek PHY driver through a softdep, so it's
# listed by hand (#1969). netconsole and configfs stream boot logs, and
# FAT with its default code pages mounts the installed ESP to write
# netlog.conf (#2149). image/tests/installer_modules.py checks the
# built installer for exactly this.
KernelModules=
        /drivers/virtio/
        /drivers/block/virtio_blk
        /drivers/net/virtio_net
        /drivers/scsi/virtio_scsi
        /drivers/scsi/sd_mod
        /drivers/nvme/host/
        /drivers/ata/ahci
        /drivers/ata/libahci
        /drivers/mmc/
        /drivers/usb/storage/
        /drivers/usb/host/
        /drivers/net/ethernet/realtek/
        /drivers/net/phy/realtek/
        /drivers/net/ethernet/intel/e1000/
        /drivers/net/ethernet/intel/e1000e/
        /drivers/net/ethernet/intel/igb/
        /drivers/net/ethernet/intel/igc/
        /drivers/net/ethernet/broadcom/tg3
        /drivers/net/usb/
        /drivers/net/netconsole
        /fs/configfs/
        /fs/efivarfs/
        /fs/fat/
        /fs/nls/nls_cp437
        /fs/nls/nls_iso8859-1

[Validation]
Checksum=yes
