# A broken build: bun never starts, so every counted boot of this version
# fails its boot check, and after the third try systemd-boot falls back to
# the version before it. appliance.yml adds this tree to the broken version
# it builds for the fallback test (image/tests/os-update.sh), and to the
# whole build when dispatched with broken_bun. Never in a published image.
[Service]
ExecStart=
ExecStart=/bin/false
