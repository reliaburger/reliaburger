# What's ready in Reliaburger, feature by feature.
#
# This file is the source of truth for https://reliaburger.com/features.
# `make features-page` (scripts/ci/features_page.py) writes the page from it,
# and `make agent-docs` then refreshes the page's Markdown copy.
# scripts/ci/test_features_page.py checks this file and the page against each
# other on every `make test-ci-scripts`.
#
# Statuses:
#   ready   built, documented, tested and exercised by the release gate, with
#           no known serious problems
#   beta    works and is tested, but has known gaps, limited soak evidence, or
#           may change shape
#   alpha   usable to try, but incomplete or likely to change
#   planned not built: give its milestone and an issue
#
# Every feature has a name, a status, a one-sentence summary, its docs (paths
# from the repository root, with an optional #anchor), and the evidence its
# status rests on. A built feature has `since`, the release it first shipped
# in; a planned one has `milestone`. `issues` lists open issues: known
# problems for a built feature, the work itself for a planned one.
# `restrictions` says what it doesn't do or needs. `needs_maintainer`, where
# present, says which judgement call the maintainer still has to make.
#
# "The release gate" is the gate in docs/releasing.md: two staged installs
# (which run a short tour), the V02 soak, the jobs soak and its 8-hour final,
# and the power-cut lanes. Its soak workloads are in
# scripts/release/sustained/soak-workloads.toml. A feature the gate doesn't
# touch can't be Ready, however well its unit tests cover it.
#
# After each release, update the statuses, `since` versions and `release`
# below (docs/releasing.md, step 10).

release = "0.2.8"
released = "12 November 2026"
reviewed = "10 November 2026"

