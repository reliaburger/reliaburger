# --- Getting a cluster -------------------------------------------------------

[[group]]
id = "cluster"
title = "Getting a cluster"

[[group.feature]]
name = "Laptop cluster"
status = "ready"
since = "0.1.0"
summary = "One command installs `relish` and builds a three-node cluster of Linux VMs on your laptop, running real containers."
restrictions = "Needs a Mac with Apple silicon, or Linux with QEMU and KVM, plus about 8 GiB of free memory and 15 GiB of disk. For development and home labs, not production."
issues = [1495]
docs = ["docs/manual/00_getting-started.md#a-cluster-on-your-laptop", "docs/quickstart.md"]
evidence = "Every gate run installs this way: two staged installs passed on 0.2.7 (qualification/2026-11-07-v0.2.7-staged-install-apple-silicon.md), and every soak runs on a quickstart cluster. #1495 (Lima QEMU abort with user-v2 networking) is open with no milestone."

[[group.feature]]
name = "Cluster on Linux machines over SSH"
status = "beta"
since = "0.2.6"
summary = "`relish setup --ssh` checks every machine first, then builds an mTLS cluster on Linux machines you already have."
restrictions = "Ubuntu or Debian, with passwordless sudo. There's no command to remove the cluster yet, and `relish local` doesn't manage it."
issues = []
docs = ["docs/manual/00_getting-started.md#a-cluster-on-your-laptop"]
evidence = "Shipped in 0.2.6 (#1529). scripts/release/qualify-ssh-setup.sh exercises it on Lima VMs (docs/testing.md), but it isn't part of the release gate and there's no qualification record yet. Manual says there's no removal command."

[[group.feature]]
name = "Cluster built by hand on Linux"
status = "beta"
since = "0.1.0"
summary = "`relish init`, join tokens and `relish join` build a cluster on Linux servers or VMs, step by step, with systemd units."
restrictions = "Rootful runc with eBPF. The release gate doesn't build a cluster by hand."
issues = []
docs = ["docs/linux-servers.md", "docs/manual/02_cluster-basics.md#add-nodes"]
evidence = "Documented in docs/linux-servers.md. The gate's clusters are built by `relish setup --quickstart`, not by hand. V04 cold installs of the quickstart passed on clean Linux x86_64 and arm64 hosts on 12 November 2026 (docs/qualification/2026-11-12-v04-cold-installs-linux.md)."

[[group.feature]]
name = "Agent-guided setup"
status = "alpha"
since = "0.2.7"
summary = "Paste one line into a coding agent and it follows a playbook: asks where the cluster should run, then installs and builds it."
restrictions = "The agent does the typing and you make the decisions. On a cloud, it checks prices and asks before creating anything that costs money."
issues = []
docs = ["docs/manual/16_working-with-an-ai-agent.md#setting-up-a-cluster-for-your-human"]
evidence = "New in 0.2.7 (homepage install section, agents page). No qualification record runs the playbook end to end; the 0.2.7 exit test (qualification/2026-11-06-v0.2.7-exit-test.md) covers diagnosis, not setup."
needs_maintainer = "Alpha because no recorded run of the playbook exists, on a laptop or a cloud. Beta if you've run it yourself and want to say so."

[[group.feature]]
name = "Council: Raft and gossip in the agent"
status = "ready"
since = "0.1.0"
summary = "Nodes find each other with SWIM gossip, and a Raft council of at most seven voters inside `bun` holds the cluster's state; spare nodes join as learners."
restrictions = "High availability starts at three nodes. A disk-pressured voter isn't replaced on a full seven-voter council, and one slow disk write can stall a node's agent loop for just over a second."
issues = [1523, 1524, 1707]
docs = ["docs/manual/02_cluster-basics.md", "docs/design/gossip-mustard.md"]
evidence = "Every gate run kills the leader and followers, cuts power, loses quorum and checks the council history is linearizable (V02 fast tier and jobs final, 0.2.7). 0.2.7 shipped with #1707 (one 1,215 ms turn, release closure). #1523 and #1524 are in 0.3.0. Learners since 0.2.5 (#1494)."

[[group.feature]]
name = "Clusters of hundreds of nodes"
status = "alpha"
since = "0.1.0"
summary = "Nothing stops you adding more nodes, but every release is soaked on three, and measurements at 500 and 1,000 simulated nodes found limits."
restrictions = "The leader refuses report connections from 500 nodes up, its API slows sharply between 500 and 1,000, and gossip at 1,000 doesn't settle within six minutes."
issues = [1411, 1412, 1413]
docs = ["docs/qualification/2026-10-28-hollow-nodes.md"]
evidence = "Hollow-node record of 28 October 2026 (measurements, not a gate) and #1411-#1413 in Later. Every soak is three nodes (docs/website/index.html, 'What the soaks don't prove')."

[[group.feature]]
name = "Contributor clusters from a checkout"
status = "beta"
since = "0.1.0"
summary = "`relish dev create` builds `bun` and `relish` from your source tree in a Lima VM and starts a cluster from them."
restrictions = "For working on Reliaburger itself; everyone else wants the laptop cluster."
issues = []
docs = ["docs/manual/02_cluster-basics.md#contributors-clusters-from-a-checkout"]
evidence = "Documented in the manual; used by contributors and agents, not by the release gate."

[[group.feature]]
name = "Homebrew install"
status = "beta"
since = "0.2.8"
summary = "`brew install reliaburger/tap/relish` installs the CLI."
restrictions = "The CLI only, on a Mac with Apple silicon or on Linux; `relish setup` then builds the cluster as after the install line. The tap existed from 0.2.7, but the site offers it from 0.2.8, with bottles so older Command Line Tools work."
issues = []
docs = ["docs/quickstart.md", "docs/releasing.md#the-homebrew-tap"]
evidence = "The homepage install box offers it (#1714), with bottles (#1713, #1712 fixed in 0.2.8). The release gate's staged installs use the install line, not Homebrew."
needs_maintainer = "Beta or Alpha? The site offers it from 0.2.8, with bottles, but the release gate never installs through Homebrew."

[[group.feature]]
name = "Bare metal in an hour"
status = "planned"
milestone = "0.3.0"
summary = "An appliance OS, `relish netboot` and claiming machines over the LAN, with weekly signed OS builds and A/B updates."
restrictions = "Built on the 0.3.0 merge train, not in any release yet. Exit test: three Dell Wyse 3040s from power-on to a cluster."
issues = [401, 402, 403, 404, 405, 406, 407]
docs = ["docs/roadmap.md#releases-after-010"]
evidence = "Roadmap 0.3.0 entry; the release-1-3-0 branch (the 0.3.0 train) carries netboot, claiming, OS updates and the Ubuntu 26.04 guest."

[[group.feature]]
name = "Several clusters as one (Franchise)"
status = "planned"
milestone = "Later"
summary = "Peered clusters with WAN gossip and cross-cluster ingress."
restrictions = "A design in the whitepaper; nothing of it runs today."
issues = [711]
docs = ["docs/whitepaper.md"]
evidence = "Whitepaper section 22 says it isn't implemented; #711 in Later."

