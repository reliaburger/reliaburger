# --- Batch jobs --------------------------------------------------------------

[[group]]
id = "jobs"
title = "Batch jobs"

[[group.feature]]
name = "Jobs on one durable lifecycle"
status = "ready"
since = "0.1.0"
summary = "One-off jobs, cron occurrences, deploy hooks and task arrays share one lifecycle, with resource admission beside apps and outcomes that survive a leader change."
restrictions = "An outcome the cluster can't confirm stays unknown and is never replayed on its own unless the job sets `replay_unknown`; you acknowledge it with `relish batch replay`."
issues = []
docs = ["docs/manual/14_batch-jobs.md#one-lifecycle-several-triggers"]
evidence = "Jobs since 0.1.0; the common lifecycle since 0.2.0. Gate: the jobs fast and 8-hour final tiers (9,439 accepted a second on 0.2.7, a job that runs twice or goes missing fails the release)."

[[group.feature]]
name = "Task arrays"
status = "ready"
since = "0.2.0"
summary = "The same command run thousands or millions of times, stored as a template and a count rather than a record per task."
restrictions = "Over a 24-hour run at 31,000 jobs a second, one node's Bun memory was still growing at the end. In 0.2.3's day run one node's job storage filled its disk; 0.2.7's run peaked at 28 MiB and didn't repeat it, but the cause isn't fixed (#1418)."
issues = [1417, 1418]
docs = ["docs/manual/14_batch-jobs.md#submit-compact-work", "docs/manual/01_deploy-an-app.md#task-arrays"]
evidence = "0.2.7 jobs final: median 1,048,576-task array in 140 s. The 0.2.7 memory run (docs/qualification/2026-11-08-v0.2.7-memory-run.md) counted 2,709,190,725 host-job tasks in 24 hours, 31,352 a second; #1417 (0.2.8) is from it. #1418 (0.3.0) is from the 0.2.3 day run and still open."
needs_maintainer = "Ready, though #1417 and #1418 only show up in a day-long run at 20,000 to 31,000 a second. Downgrade to Beta if you count them as serious."

[[group.feature]]
name = "Cron"
status = "beta"
since = "0.1.0"
summary = "Schedules in the Kubernetes CronJob dialect, in UTC, with the leader claiming each minute durably."
restrictions = "Missed minutes are skipped: no catch-up, and no exactly-once promise. A catalogue test that waits for a cron firing is flaky."
issues = []
docs = ["docs/README.md#jobs-and-cron"]
evidence = "README 'Limits in 0.2.7' and docs/README 'Jobs and cron'. #1527 (flake waiting for a cron firing) in 0.2.8. The soak's job campaign isn't cron-driven."

[[group.feature]]
name = "Fresh-container and shared-container jobs"
status = "ready"
since = "0.2.0"
summary = "A job runs each attempt in a fresh container, or each command as its own process with its own limits in a reused container."
restrictions = "Needs rootful runc on Linux."
issues = []
docs = ["docs/manual/14_batch-jobs.md#reusable-containers"]
evidence = "Every gate run's job campaign uses runc and shared-runc executors (V02 fast tier, 0.2.7: 16,133 and 491,487 accepted successes)."

[[group.feature]]
name = "Host jobs"
status = "beta"
since = "0.2.0"
summary = "Allowlisted host commands, for speed when you don't need a container boundary."
restrictions = "No isolation. Each binary must be allowlisted, explicit runc mode refuses them, and task arrays need `mount_isolation = false` until they can run under process mount isolation."
