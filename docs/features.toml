docs = ["docs/manual/14_batch-jobs.md#execution-and-capacity-limits"]
evidence = "The gate runs process jobs (504,800 in the 0.2.7 V02 fast tier), with mount_isolation=false. TODO(#714) in src/bun/task_array_node.rs; `relish test` refuses host workloads until #714."

