evidence = "The gate's nodes are Ubuntu 24.04 aarch64 Lima guests (staged install record, Downloaded bytes). Privileged Linux CI suites run on x86_64. V04 cold installs passed 3 of 3 on clean Linux x86_64 (GitHub-hosted) and arm64 (Lima) hosts, median 85 s and 83 s (docs/qualification/2026-11-12-v04-cold-installs-linux.md)."

