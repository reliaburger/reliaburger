<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 272" width="720" height="272" role="img" aria-labelledby="t">
<title id="t">Accepted jobs a second</title>
<style>svg{--surface:#fcfcfb;--ink:#0b0b0b;--ink-2:#52514e;--muted:#8a8984;--grid:#e6e5e0;--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-other:#8a8984}
@media (prefers-color-scheme: dark){svg{--surface:#1a1a19;--ink:#f0efec;--ink-2:#c3c2b7;--muted:#8f8e86;--grid:#33332f;--series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-other:#8f8e86}}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:11px;fill:var(--ink-2,#52514e)}
.title{font-size:13px;font-weight:600;fill:var(--ink,#0b0b0b)}
.surface{fill:var(--surface,#fcfcfb)}
.grid{stroke:var(--grid,#e6e5e0);stroke-width:1}
.axis{stroke:var(--muted,#8a8984);stroke-width:1}
.line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.s1{stroke:var(--series-1,#2a78d6)}.f1{fill:var(--series-1,#2a78d6)}.s2{stroke:var(--series-2,#eb6834)}.f2{fill:var(--series-2,#eb6834)}.s3{stroke:var(--series-3,#1baf7a)}.f3{fill:var(--series-3,#1baf7a)}.s0{stroke:var(--series-other,#8a8984)}.f0{fill:var(--series-other,#8a8984)}
.target{stroke:var(--ink-2,#52514e);stroke-width:1;stroke-dasharray:4 3}
.mark{stroke:var(--ink-2,#52514e);fill:none;stroke-width:1.5}
.mark.failure{stroke:var(--ink,#0b0b0b);stroke-width:2}
.mark.special,.mark.upgrade{fill:var(--surface,#fcfcfb)}</style>
