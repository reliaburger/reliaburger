.s1{stroke:var(--series-1,#2a78d6)}.f1{fill:var(--series-1,#2a78d6)}.s2{stroke:var(--series-2,#eb6834)}.f2{fill:var(--series-2,#eb6834)}.s3{stroke:var(--series-3,#1baf7a)}.f3{fill:var(--series-3,#1baf7a)}.s0{stroke:var(--series-other,#8a8984)}.f0{fill:var(--series-other,#8a8984)}
.target{stroke:var(--ink-2,#52514e);stroke-width:1;stroke-dasharray:4 3}
.mark{stroke:var(--ink-2,#52514e);fill:none;stroke-width:1.5}
.mark.failure{stroke:var(--ink,#0b0b0b);stroke-width:2}
.mark.special,.mark.upgrade{fill:var(--surface,#fcfcfb)}</style>
