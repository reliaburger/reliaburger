# The CI gate denies every RustSec warning that is not named here. Each
# remaining exception is an *unmaintained* informational advisory or a
# lock-only dependency with no compiled path — none has a patched release to
# upgrade to. `make audit` enforces the review date below before running
# cargo-audit, so the list can't silently rot.
#
# Reviewed 18 September 2026; see docs/qualification/2026-09-18-dependency-exceptions.md.
# RUSTSEC-2024-0449 (unsafe-libyaml) was added 12 October 2026 (see
# docs/qualification/2026-10-12-dependency-exceptions.md) and removed the same
# month: relish moved from serde_yaml to yaml_serde, which uses libyaml-rs (#817).
# rustls-pemfile was removed in favour of the existing Rustls PEM parser.
# Earlier exceptions were
# fixed by upgrades rather than re-ignored:
#   - RUSTSEC-2026-0002 + RUSTSEC-2026-0253 (lru): ratatui 0.29 -> 0.30 pulls
#     lru 0.18.2, which patches both. Removed.
#   - RUSTSEC-2026-0190 (anyhow::Error::downcast_mut): anyhow 1.0.102 -> 1.0.104.
#     Removed.
#   - RUSTSEC-2026-0235 (rkyv 0.7): the October 2026 dependency refresh (#1026)
#     dropped rust_decimal's lock-only rkyv from Cargo.lock, so the exception
#     and make audit's empty-graph guard went with it. Removed.
#   - RUSTSEC-2024-0436 (paste): DataFusion 45 -> 55 drops paste from the
#     graph, along with the Thrift crate behind GHSA-2f9f-gq7v-9h6m. Removed.
#   - RUSTSEC-2025-0141 (bincode): no release fixes it, and bincode 3.0.0 is
#     a compile_error! tombstone, so gossip, reporting frames and the Raft
#     metadata moved to postcard (#1026). Removed.
#   - RUSTSEC-2024-0370 (proc-macro-error): age 0.10 -> 0.12 (#1026) moves to
#     i18n-embed-fl 0.10, which uses proc-macro-error2. Removed. age is now
#     0.11.5 (below), whose i18n-embed-fl 0.9.4 also uses proc-macro-error2.
#   - RUSTSEC-2026-0381 (webpki-roots 0.26.11 shim, distrusted emSign
#     intermediates), added 21 October 2026: RustSec amended the advisory the
#     same day to list the 0.26.11 shim as unaffected, provided its 1.x parent
#     is patched (Cargo.lock holds 1.0.10). Removed 12 November 2026.
#     tests/suite/dependency_audit.rs still fails if 1.x is unpatched (#1269).
#   - RUSTSEC-2026-0391 and 0395 to 0406 (zstd 0.13.3, zstd-safe 7.3.0), added
#     26 October 2026: zstd 0.13.4 and zstd-safe 7.4.0 (1 November 2026) patch
#     all 13 and satisfy parquet, arrow-ipc and DataFusion 55.2.0's ^0.13.
#     Removed 12 November 2026; moving DataFusion to arrow 60 stays #1366.
#   See docs/qualification/2026-11-12-dependency-exceptions.md.
#
# RUSTSEC-2026-0374 (basic-toml) was added 20 October 2026 (see
# docs/qualification/2026-10-20-dependency-exceptions.md): unmaintained, no
# patched release, reached only at compile time through age's i18n proc macros.
# RUSTSEC-2026-0173 (proc-macro-error2) was added 25 October 2026 (see
# docs/qualification/2026-10-25-dependency-exceptions.md): unmaintained, no
# patched release, compile time only, through age 0.11.5's i18n proc macros.
# age 0.12 avoided it but compiled in P-256 code built on crypto-bigint 0.5
# (RUSTSEC-2026-0387, timing variability), so age went back to 0.11.5.
# Both were reviewed again and kept on 12 November 2026: no newer basic-toml,
# proc-macro-error2, age or i18n-config release changes that.
# Next review: 10 December 2026.
[advisories]
ignore = [
    "RUSTSEC-2026-0374",
    "RUSTSEC-2026-0173",
]

[output]
deny = ["warnings"]
quiet = false
