name: Appliance image

# The Reliaburger appliance: Ubuntu 26.04 built with mkosi, one native build
# per architecture (docs/plans/2026-10-01-plan-appliance-product.md, W1).
#
# Pull requests build the `lab` profile, boot-test it and sign it with a
# throwaway key, for the QEMU lab. A weekly run on main (or a dispatch with
# `publish`) builds the production image with the release public key inside;
# then a job that runs no third-party actions signs it with the release key
# (RELIABURGER_RELEASE_KEY), the netboot install test re-runs on the signed
# artefacts, and the build is published as GitHub releases
# os-<version>-<arch> with a signed os-channel.json. A week whose packages
# match the last release publishes nothing.

on:
  workflow_dispatch:
    inputs:
      bun_release:
        description: Release tag to take bun and relish from (default is the newest published v* release, else the newest staging candidate)
        required: false
      broken_bun:
        description: "Spike S4: build an image whose bun refuses to start, to test the A/B fallback (never published)"
        type: boolean
        default: false
      publish:
        description: Sign with the release key and publish (main only)
        type: boolean
        default: false
  schedule:
    # Monday 04:00 UTC: Ubuntu's kernels and USNs of the previous week.
    - cron: "0 4 * * 1"
  pull_request:
    # release-* is each release's merge train (the appliance's is
    # release-1-3-0): PRs into it build and test the image too.
    branches: [main, "feat/appliance-*", "release-*"]
    paths:
      - "image/**"
      - ".github/workflows/appliance.yml"

concurrency:
  group: appliance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Whether this run publishes, and the version it builds.
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          BROKEN: ${{ inputs.broken_bun }}
        run: |
          set -euo pipefail
          publish=false
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$BROKEN" != true ] \
              && { [ "$EVENT" = schedule ] || [ "$PUBLISH_INPUT" = true ]; }; then
            publish=true
          fi
          week=$(date -u +%G.%V)
          if [ "$publish" = true ]; then
            tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName')
            # shellcheck disable=SC2086
            version=$(python3 scripts/release/os_release.py next-version --week "$week" $tags)
          else
            # Lab builds: the run number, so they never collide with each other.
            version="$week.$GITHUB_RUN_NUMBER"
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Appliance $version, publish: $publish" >> "$GITHUB_STEP_SUMMARY"

  # Lab builds carry the bun and relish of the commit under test, so a PR's
  # bun changes run in its own appliance image. Published builds and a
  # dispatch naming bun_release take a release instead.
  bun:
    name: bun from source (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.publish != 'true' && inputs.bun_release == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - arch: aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      RELIABURGER_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: appliance-${{ matrix.target }}
      - name: Build bun and relish
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev
          cargo build --locked --release --target ${{ matrix.target }} --features ebpf --bin bun --bin relish
          mkdir -p dist
          cp target/${{ matrix.target }}/release/bun dist/bun-linux-${{ matrix.arch }}
          cp target/${{ matrix.target }}/release/relish dist/relish-linux-${{ matrix.arch }}
          dist/bun-linux-${{ matrix.arch }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: bun-source-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  # The image's shell scripts that have unit tests (image/tests): quick, and
  # Linux-only, since the scripts use GNU coreutils as the appliance does.
  scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Script tests
        run: python3 -m unittest discover -s image/tests -v

  image:
    name: image (${{ matrix.arch }})
    needs: [plan, bun]
    # bun is skipped for published builds; the image still runs.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.bun.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      ARCH: ${{ matrix.arch }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      IMAGE_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        # The tools tree, the package downloads and the image all land on the
        # runner's root disk; drop toolchains this job never uses.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up mkosi v27
        uses: systemd/mkosi@f2b04fcd671110e3a7372027162752f71de0c9b0 # v27

      - uses: actions/download-artifact@v4
        if: needs.bun.result == 'success'
        with:
          name: bun-source-${{ matrix.arch }}
          path: source-bin

      - name: Fetch bun and relish
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.bun_release }}
        run: |
          set -euo pipefail
          if [ -d source-bin ]; then
            install -D -m 0755 "source-bin/bun-linux-$ARCH" image/bin-tree/usr/lib/reliaburger/bin/bun
            install -D -m 0755 "source-bin/relish-linux-$ARCH" image/bin-tree/usr/lib/reliaburger/bin/relish
            echo "BUN_RELEASE=source-$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "### bun and relish built from \`$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="$REQUESTED"
          if [ -z "$tag" ]; then
            # Published releases only: old v0.0.x pre-releases lack SHA256SUMS.
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 \
              --exclude-pre-releases --exclude-drafts --json tagName \
              --jq '[.[].tagName | select(startswith("v"))][0] // empty')
          fi
          if [ -z "$tag" ]; then
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 50 --json tagName \
              --jq '[.[].tagName | select(startswith("staging-v"))][0]')
          fi
          echo "BUN_RELEASE=$tag" >> "$GITHUB_ENV"
          mkdir -p dl
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir dl \
            -p "bun-linux-$ARCH" -p "relish-linux-$ARCH" -p SHA256SUMS
          (cd dl && sha256sum --check --ignore-missing SHA256SUMS)
          install -D -m 0755 "dl/bun-linux-$ARCH" image/bin-tree/usr/lib/reliaburger/bin/bun
          install -D -m 0755 "dl/relish-linux-$ARCH" image/bin-tree/usr/lib/reliaburger/bin/relish
          echo "### bun and relish from \`$tag\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Break bun on purpose (spike S4)
        # workflow_dispatch's broken_bun, or a commit adding image/spike-broken-bun
        # (dispatch needs the workflow on main).
        if: (inputs.broken_bun || hashFiles('image/spike-broken-bun') != '') && env.PUBLISH != 'true'
        run: |
          set -euo pipefail
          install -D -m 0644 /dev/stdin image/bin-tree/usr/lib/systemd/system/reliaburger.service.d/50-spike-broken.conf <<'CONF'
          # Spike S4: this build's bun never starts, so its boot check fails and
          # systemd-boot has to fall back to the previous version.
          [Service]
          ExecStart=
          ExecStart=/bin/false
          CONF
          echo "### Broken on purpose: bun won't start in this image" >> "$GITHUB_STEP_SUMMARY"
          # Its boot tests would fail by design; skip them so it still uploads.
          echo "BROKEN_BUN=1" >> "$GITHUB_ENV"

      - name: Throwaway signing key
        # Lab builds only: a fresh Ed25519 key per run, whose public half
        # replaces the release key in the image and the installer, so the lab
        # can check its signatures. A published build keeps the committed
        # release public key (image/**/os-signing-key.pub.pem), and the sign
        # job signs it with the release key.
        if: env.PUBLISH != 'true'
        run: |
          set -euo pipefail
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/spike.key"
          openssl pkey -in "$RUNNER_TEMP/spike.key" -pubout -out "$RUNNER_TEMP/spike.pub.pem"
          install -D -m 0644 "$RUNNER_TEMP/spike.pub.pem" \
            image/mkosi.images/installer/mkosi.extra/usr/lib/reliaburger/os-signing-key.pub.pem
          install -D -m 0644 "$RUNNER_TEMP/spike.pub.pem" \
            image/bin-tree/usr/lib/reliaburger/os-signing-key.pub.pem

      - name: Build the image
        run: |
          set -euo pipefail
          profile=()
          # The lab's image has sshd (mkosi.conf.d/30-lab.conf); published ones don't.
          [ "$PUBLISH" = true ] || profile=(--profile lab)
          start=$(date +%s)
          mkosi -C image --image-version "$IMAGE_VERSION" "${profile[@]}" \
            --extra-tree "$GITHUB_WORKSPACE/image/bin-tree" build
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          # What the quiet-week check compares besides the packages.
          printf 'bun %s\nimage %s\n' "$BUN_RELEASE" "$(git rev-parse HEAD:image)" \
            > "image/mkosi.output/reliaburger-os_$IMAGE_VERSION.build"

      - name: Build the next version (x86-64 lab builds)
        # A second build, one version on, for the OS update test: same
        # sources, but a different version makes it a different /usr.
        if: matrix.arch == 'x86_64' && env.PUBLISH != 'true' && env.BROKEN_BUN != '1' && hashFiles('source-bin/relish-linux-x86_64') != ''
        run: |
          set -euo pipefail
          next="${IMAGE_VERSION%.*}.$(( ${IMAGE_VERSION##*.} + 1 ))"
          echo "NEXT_VERSION=$next" >> "$GITHUB_ENV"
          mkosi -C image --image-version "$next" --profile lab \
            --extra-tree "$GITHUB_WORKSPACE/image/bin-tree" \
            --output-dir "$RUNNER_TEMP/next" build
          ls -l "$RUNNER_TEMP/next"

      - name: Record sizes
        run: |
          set -euo pipefail
          cd image/mkosi.output
          ls -l
          {
            echo "### Appliance $IMAGE_VERSION ($ARCH), built in ${BUILD_SECONDS} s"
            echo '```'
            ls -l
            echo '```'
            echo "Packages: $(jq '.packages | length' *.manifest 2>/dev/null || echo '?')"
            echo "Kernel: $(jq -r '.packages[] | select(.name | startswith("linux-image-")) | "\(.name) \(.version)"' *.manifest 2>/dev/null | tr '\n' ' ')"
            echo "Firmware: $(jq -r '.packages[] | select(.name | startswith("linux-firmware")) | .name' *.manifest 2>/dev/null | tr '\n' ' ')"
            du -sh ../mkosi.tools 2>/dev/null | sed 's/^/Tools tree: /' || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build iPXE
        # Pinned and built here rather than downloaded (research §4.7), with
        # image/netboot/embed.ipxe built in.
        env:
          IPXE_COMMIT: 12798ec29aa8a64d8675c4378b99f5fe28447afb # v2.0.0
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential liblzma-dev
          git init -q "$RUNNER_TEMP/ipxe"
          git -C "$RUNNER_TEMP/ipxe" fetch -q --depth 1 https://github.com/ipxe/ipxe "$IPXE_COMMIT"
          git -C "$RUNNER_TEMP/ipxe" checkout -q FETCH_HEAD
          case "$ARCH" in
            x86_64) dir=bin-x86_64-efi name=x86_64 ;;
            aarch64) dir=bin-arm64-efi name=arm64 ;;
          esac
          # snp.efi drives the NICs through the firmware's own drivers, which
          # is what odd NICs (the Wyse's Realtek) need; it's the default, as
          # in Sidero's Omni. ipxe.efi brings iPXE's drivers, for firmware
          # whose network stack is broken but whose NIC iPXE knows.
          make -s -C "$RUNNER_TEMP/ipxe/src" -j"$(nproc)" "$dir/snp.efi" "$dir/ipxe.efi" \
            EMBED="$GITHUB_WORKSPACE/image/netboot/embed.ipxe"
          mkdir -p image/mkosi.output/netboot
          cp "$RUNNER_TEMP/ipxe/src/$dir/snp.efi" "image/mkosi.output/netboot/ipxe-snp-$name.efi"
          cp "$RUNNER_TEMP/ipxe/src/$dir/ipxe.efi" "image/mkosi.output/netboot/ipxe-$name.efi"
          cp image/netboot/boot.ipxe image/mkosi.output/netboot/
          ls -l image/mkosi.output/netboot

      - name: List the netboot files in SHA256SUMS
        # One signature then covers everything a release publishes: the image,
        # the installer and iPXE (relish image download checks them all).
        run: |
          set -euo pipefail
          cd image/mkosi.output
          sums="reliaburger-os_$IMAGE_VERSION.SHA256SUMS"
          for f in "reliaburger-os-installer_$IMAGE_VERSION.efi" netboot/*; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$(basename "$f")" >> "$sums"
          done
          cat "$sums"

      - name: Sign (throwaway key)
        if: env.PUBLISH != 'true'
        run: |
          set -euo pipefail
          cd image/mkosi.output
          cp "$RUNNER_TEMP/spike.pub.pem" spike-signing-key.pub.pem
          for sums in *.SHA256SUMS "$RUNNER_TEMP"/next/*.SHA256SUMS; do
            [ -f "$sums" ] || continue
            openssl pkeyutl -sign -inkey "$RUNNER_TEMP/spike.key" -rawin -in "$sums" -out "$sums.sig"
            openssl pkeyutl -verify -pubin -inkey spike-signing-key.pub.pem -rawin -in "$sums" -sigfile "$sums.sig"
          done
          rm -f "$RUNNER_TEMP/spike.key"

      - name: Boot test
        if: env.BROKEN_BUN != '1'
        # x86-64 runs under KVM. Hosted arm64 runners have no /dev/kvm, so
        # aarch64 falls back to TCG: slower, but it catches an image that
        # doesn't boot (like the 26.04 stubble kernel did) before the Mac lab.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          if [ "$ARCH" = x86_64 ]; then
            sudo apt-get install -y -qq qemu-system-x86 ovmf zstd
            qemu_bin=qemu-system-x86_64 machine=q35
            code=/usr/share/OVMF/OVMF_CODE_4M.fd vars=/usr/share/OVMF/OVMF_VARS_4M.fd
          else
            sudo apt-get install -y -qq qemu-system-arm qemu-efi-aarch64 zstd
            qemu_bin=qemu-system-aarch64 machine=virt
            code=/usr/share/AAVMF/AAVMF_CODE.fd vars=/usr/share/AAVMF/AAVMF_VARS.fd
          fi
          if [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null; then
            accel=kvm cpu=host deadline=600
          else
            # pauth-impdef: QEMU's own pointer-auth algorithm is much faster
            # to emulate than the architected one.
            accel=tcg cpu=max,pauth-impdef=on deadline=1200
          fi
          echo "Booting with $qemu_bin, accel=$accel"
          zstd -q -d "image/mkosi.output/reliaburger-os_${IMAGE_VERSION}.raw.zst" -o "$RUNNER_TEMP/disk.raw"
          # An 8 GB disk, like the Wyse 3040: first boot adds slot B and grows
          # the data partition into the free space.
          truncate -s 8G "$RUNNER_TEMP/disk.raw"
          cp "$vars" "$RUNNER_TEMP/vars.fd"
          log="$RUNNER_TEMP/serial.log"
          # 2 GiB, like the Wyse 3040.
          "$qemu_bin" -machine "$machine,accel=$accel" -cpu "$cpu" -smp 2 -m 2048 \
            -drive if=pflash,format=raw,readonly=on,file="$code" \
            -drive if=pflash,format=raw,file="$RUNNER_TEMP/vars.fd" \
            -drive if=virtio,format=raw,file="$RUNNER_TEMP/disk.raw" \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -display none -serial "file:$log" -no-reboot &
          qemu=$!
          start=$(date +%s)
          result=timeout
          while [ $(( $(date +%s) - start )) -lt "$deadline" ]; do
            if grep -q -e "reliaburger: bun healthy" -e "reliaburger: unclaimed" "$log" 2>/dev/null; then result=pass; break; fi
            if grep -q "reliaburger: bun not healthy" "$log" 2>/dev/null; then result=fail; break; fi
            if ! kill -0 "$qemu" 2>/dev/null; then result=exited; break; fi
            sleep 5
          done
          elapsed=$(( $(date +%s) - start ))
          kill "$qemu" 2>/dev/null || true
          echo "--- serial console ---"
          cat "$log" || true
          # systemd breaks an ordering cycle by dropping jobs (once, /boot's
          # automount), and the boot can still look healthy: refuse it.
          # boot-check copies them from the journal onto the console.
          if grep -q "reliaburger: ordering cycle:" "$log"; then
            result="$result, with ordering cycles"
          fi
          echo "### Boot test: $result after ${elapsed} s" >> "$GITHUB_STEP_SUMMARY"
          grep "reliaburger:" "$log" >> "$GITHUB_STEP_SUMMARY" || true
          [ "$result" = pass ]

      - name: Netboot install test (x86-64, KVM)
        # A published build runs it after signing, in the verify job.
        if: matrix.arch == 'x86_64' && env.BROKEN_BUN != '1' && env.PUBLISH != 'true'
        timeout-minutes: 20
        run: image/tests/netboot-install.sh image/mkosi.output "$IMAGE_VERSION"

      - name: relish netboot install (x86-64, KVM)
        # The same install, served by the commit's relish as a ProxyDHCP
        # beside an ordinary DHCP server (lab builds only).
        if: matrix.arch == 'x86_64' && env.BROKEN_BUN != '1' && hashFiles('source-bin/relish-linux-x86_64') != ''
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq dnsmasq-base
          chmod +x source-bin/relish-linux-x86_64
          image/tests/relish-netboot-install.sh image/mkosi.output "$IMAGE_VERSION" source-bin/relish-linux-x86_64

      - name: Seeded pair (x86-64, KVM)
        # Two appliances form a cluster from their seeds alone, with the
        # bun and relish of the commit under test (lab builds only).
        if: matrix.arch == 'x86_64' && env.BROKEN_BUN != '1' && hashFiles('source-bin/relish-linux-x86_64') != ''
        timeout-minutes: 25
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq dnsmasq-base
          chmod +x source-bin/relish-linux-x86_64
          image/tests/seeded-pair.sh image/mkosi.output "$IMAGE_VERSION" source-bin/relish-linux-x86_64

      - name: Claimed pair (x86-64, KVM)
        # Two unseeded appliances claimed over the LAN: mDNS discovery, the
        # pinned claim, and a join through the firewall's join window.
        if: matrix.arch == 'x86_64' && env.BROKEN_BUN != '1' && hashFiles('source-bin/relish-linux-x86_64') != ''
        timeout-minutes: 25
        run: image/tests/claimed-pair.sh image/mkosi.output "$IMAGE_VERSION" source-bin/relish-linux-x86_64

      - name: OS update (x86-64, KVM)
        # bun rolls the next version onto a one-node cluster: staging,
        # sysupdate, the reboot and the boot checks, end to end.
        if: env.NEXT_VERSION != ''
        timeout-minutes: 30
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq dnsmasq-base
          chmod +x source-bin/relish-linux-x86_64
          image/tests/os-update.sh image/mkosi.output "$IMAGE_VERSION" \
            "$RUNNER_TEMP/next" "$NEXT_VERSION" source-bin/relish-linux-x86_64

      - name: Upload the image
        uses: actions/upload-artifact@v4
        with:
          name: appliance-${{ matrix.arch }}
          path: |
            image/mkosi.output/*.raw*
            !image/mkosi.output/*.esp.raw*
            !image/mkosi.output/*.root-*.raw*
            image/mkosi.output/*.efi
            image/mkosi.output/*.manifest
            image/mkosi.output/*.build
            image/mkosi.output/*.SHA256SUMS*
            image/mkosi.output/spike-signing-key.pub.pem
            image/mkosi.output/netboot/
          if-no-files-found: error
          # zstd-compressed already. Lab artefacts are for the next day's lab;
          # a published build's go into its releases within the run.
          compression-level: 0
          retention-days: ${{ env.PUBLISH == 'true' && 3 || 1 }}

  # Sign a published build with the release key. Only first-party actions
  # run here: this job holds the key that every bun trusts.
  sign:
    needs: [plan, image]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changed.outputs.changed }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: appliance-*
          path: art
      - name: Did anything change since the last release?
        id: changed
        run: |
          set -euo pipefail
          changed=true
          last=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName \
            --jq '[.[].tagName | select(test("^os-[0-9]{4}\\.[0-9]{2}\\.[0-9]+-x86_64$"))] | .[0] // empty')
          if [ -n "$last" ]; then
            same=true
            for arch in x86_64 aarch64; do
              tag="${last%-x86_64}-$arch"
              mkdir -p "prev/$arch"
              if ! gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "prev/$arch" \
                  -p 'reliaburger-os_*.manifest' -p 'reliaburger-os_*.build'; then
                same=false
                continue
              fi
              previous='' previous_record=''
              for f in prev/"$arch"/reliaburger-os_*.manifest; do previous=$f; done
              for f in prev/"$arch"/reliaburger-os_*.build; do previous_record=$f; done
              python3 scripts/release/os_release.py unchanged --previous "$previous" \
                --current "art/appliance-$arch/reliaburger-os_$VERSION.manifest" \
                --previous-record "$previous_record" \
                --current-record "art/appliance-$arch/reliaburger-os_$VERSION.build" || same=false
            done
            [ "$same" = true ] && changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "### Changed since ${last:-the first release}: $changed" >> "$GITHUB_STEP_SUMMARY"
      - name: Sign with the release key and write the channel
        if: steps.changed.outputs.changed == 'true'
        env:
          RELIABURGER_RELEASE_KEY: ${{ secrets.RELIABURGER_RELEASE_KEY }}
        run: |
          set -euo pipefail
          # Each subcommand reads the key from the environment and drops it.
          key="$RELIABURGER_RELEASE_KEY"
          python3 scripts/release/os_release.py sign art/appliance-x86_64 art/appliance-aarch64
          RELIABURGER_RELEASE_KEY="$key" python3 scripts/release/os_release.py channel \
            --version "$VERSION" --out art/channel \
            "x86_64=art/appliance-x86_64/reliaburger-os_$VERSION.SHA256SUMS" \
            "aarch64=art/appliance-aarch64/reliaburger-os_$VERSION.SHA256SUMS"
          unset key
          # Check with the public key the image ships, as the installer will.
          pem=image/mkosi.extra/usr/lib/reliaburger/os-signing-key.pub.pem
          for f in art/appliance-*/reliaburger-os*.SHA256SUMS art/channel/os-channel.json; do
            openssl pkeyutl -verify -pubin -inkey "$pem" -rawin -in "$f" -sigfile "$f.sig"
          done
          for arch in x86_64 aarch64; do
            mkdir -p "signed/$arch"
            cp art/appliance-$arch/*.sig "signed/$arch/"
          done
          cp art/channel/os-channel.json art/channel/os-channel.json.sig signed/
      - uses: actions/upload-artifact@v4
        if: steps.changed.outputs.changed == 'true'
        with:
          name: appliance-signed
          path: signed/
          retention-days: 3

  # The netboot install test again, on the signed artefacts: a published
  # image's installer trusts only the release key.
  verify:
    needs: [plan, sign]
    if: needs.sign.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: appliance-x86_64
          path: art
      - uses: actions/download-artifact@v4
        with:
          name: appliance-signed
          path: signed
      - name: Netboot install test (x86-64, KVM)
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          cp signed/x86_64/*.sig art/
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 ovmf
          sudo chmod 666 /dev/kvm
          image/tests/netboot-install.sh art "$VERSION"

  publish:
    needs: [plan, sign, verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: appliance-*
          path: art
      - name: Release each architecture
        run: |
          set -euo pipefail
          for arch in x86_64 aarch64; do
            dir="art/appliance-$arch"
            cp art/appliance-signed/$arch/*.sig "$dir/"
            mv "$dir"/netboot/* "$dir/"
            rmdir "$dir/netboot"
            kernel=$(jq -r '[.packages[] | select(.name | startswith("linux-image-")) | .version][0] // "?"' \
              "$dir/reliaburger-os_$VERSION.manifest")
            gh release create "os-$VERSION-$arch" --repo "$GITHUB_REPOSITORY" --prerelease \
              --latest=false --target "$GITHUB_SHA" --title "Reliaburger OS $VERSION ($arch)" \
              --notes "The appliance OS for $arch: Ubuntu 26.04, kernel $kernel. Every file is listed in reliaburger-os_$VERSION.SHA256SUMS, signed with the release key; os-channel.json (release os-channel) names the newest version." \
              "$dir"/*
          done
      - name: Point the channel at it
        run: |
          set -euo pipefail
          if ! gh release view os-channel --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create os-channel --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
              --target "$GITHUB_SHA" --title "Reliaburger OS channel" \
              --notes "os-channel.json names the newest appliance OS release, and os-channel.json.sig is its signature by the release key."
          fi
          gh release upload os-channel --repo "$GITHUB_REPOSITORY" --clobber \
            art/appliance-signed/os-channel.json art/appliance-signed/os-channel.json.sig
          echo "### Published os-$VERSION-x86_64 and os-$VERSION-aarch64" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the last 8 versions
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 300 --json tagName --jq '.[].tagName')
          # shellcheck disable=SC2086
          for tag in $(python3 scripts/release/os_release.py prune --keep 8 $tags); do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
