name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    # fix/** covers review PRs stacked on each other rather than on main.
    branches: [main, "codex/**", "fix/**"]
    # labeled lets a `full-ci` label start the heavy suites on a stacked PR.
    types: [opened, synchronize, reopened, labeled]
  schedule:
    # Nightly full run on main, including the benchmarks.
    - cron: "17 3 * * *"

# PR updates supersede earlier checks. Main/tag runs each retain their own group.
# Fixed prefixes also keep reusable source CI separate from its release caller,
# and github.workflow (the caller's name when called) keeps a retarget run
# (ci-retarget.yml) from cancelling the pull request's own run.
concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Caches: GitHub keeps 10 GB per repository. Jobs that build the same profile
# share one key, and only pushes to main save, even when tests fail. PRs,
# stacked or not, restore main's cache instead of evicting each other's.
# Debug builds keep line tables only: backtraces still name files and lines,
# and each target cache is roughly half the size, so they all fit.
# Artefacts: reports are kept 14 days; release candidates keep their 90.
# Every nextest suite keeps its own JUnit report (scripts/ci/keep-junit.sh)
# and each job uploads them as junit-<job>, even when a suite fails.

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    # Which job groups this run needs; see scripts/ci/select-jobs.sh.
    name: select jobs
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.select.outputs.code }}
      gossip: ${{ steps.select.outputs.gossip }}
      heavy: ${{ steps.select.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          # The PR event names the branch it targets; github.base_ref reported
          # main for a PR stacked on another branch (run 35921062344).
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: scripts/ci/select-jobs.sh

  ci-policy:
    # The CI scripts' own tests (job selection, ignored-test owners, JUnit
    # keeping) and the rule that every #[ignore] names who runs it. Cheap,
    # so it runs on every change, documentation included.
    name: CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test the CI scripts
        run: make test-ci-scripts
      - name: Every ignored test names its owner
        run: make check-ignored

  dependency-audit:
    name: dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: make audit

  lint:
    # Formatting and Clippy report on their own, a few minutes in, instead of
    # waiting behind the test suite.
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libbpf-dev llvm
      - name: Format
        run: make fmt-check
      - name: Lint every target, with all features and with none
        run: make lint

  demo-app:
    # The five-minute tour builds examples/demo/burger on a node. Its own Go
    # tests take seconds, so they run on every code change.
    name: demo app
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/demo/burger/go.mod
          cache: false
      - name: Vet and test the demo app
        working-directory: examples/demo/burger
        run: |
          go vet ./...
          go test ./...

  minimum-rust:
    # The declared minimum compiler must build every target with and without
    # default features. The stable jobs run the tests, so running them again
    # on 1.97 would only repeat the same suite.
    name: minimum Rust 1.97.0
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: minimum-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get remove -y -qq buildah
          sudo apt-get install -y -qq clang libbpf-dev llvm
      - name: Check every target and feature with the locked graph
        run: cargo check --locked --all-targets --all-features
      - name: Check every target without default features
        run: cargo check --locked --all-targets --no-default-features

  portable:
    # The Linux portable suite runs once, instrumented: the same run is the
    # test gate, the coverage gate and the JUnit source.
    name: portable Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145,cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get remove -y -qq buildah
          sudo apt-get install -y -qq clang libbpf-dev llvm
      - name: Portable tests with line coverage
        run: make coverage
      - name: Keep the portable report
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh coverage make coverage
      - name: Doctests
        run: make test-doc
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-portable
          path: target/junit
          if-no-files-found: error
          retention-days: 14
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: privileged Linux
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-privileged
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install runtime and kernel test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs buildah busybox-static gcc clang iproute2 libbpf-dev linux-headers-$(uname -r) llvm nftables runc slirp4netns uidmap
      - name: Mount persistent BPF storage for kernel recovery tests
        run: mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
      - name: Permit rootless runc on Ubuntu AppArmor hosts
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Restore the pinned test images
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-images
          key: test-images-${{ runner.arch }}-${{ hashFiles('tests/fixtures/pinned-images.txt') }}
      - name: Warm the pinned test images
        # One fetch with retries, before any timed test. The suites then pull
        # from a loopback mirror of this digest-verified cache.
        run: make test-images TEST_IMAGE_CACHE="$RUNNER_TEMP/test-images"
      - name: Prove rootless port adoption
        if: false
        run: make test-rootless-runc
      - name: Keep the rootless report
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh test-rootless-runc make test-rootless-runc
      - name: Qualify actual Bun OCI interruptions
        run: scripts/release/qualify-oci-interruptions.sh
      - name: Retain OCI interruption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-interruption-evidence
          path: /var/tmp/reliaburger-oci-interruptions.*/
          if-no-files-found: ignore
          retention-days: 14
      - name: Run only provisioned Linux tests
        if: false
        # The qualification step above already ran owned_runc and owned_network
        # in a private namespace.
        run: >-
          sudo -E env PATH="$PATH" NEXTEST_PROFILE=ci make test-linux
          TEST_IMAGE_CACHE="$RUNNER_TEMP/test-images"
          LINUX_EXCLUDE='& not binary(owned_runc) & not binary(owned_network)'
      - name: Keep the provisioned Linux report
        if: ${{ !cancelled() }}
        run: >-
          scripts/ci/keep-junit.sh test-linux make test-linux --features ebpf
          LINUX_EXCLUDE='& not binary(owned_runc) & not binary(owned_network)'
      - name: Upload JUnit
        # Names every test this job ran; ignored-evidence fails if a test
        # owned by these gates is missing.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-linux
          path: target/junit
          if-no-files-found: error
          retention-days: 14

  build-tests:
    # Compile the portable test binaries once. The acceptance jobs download
    # this nextest archive instead of each rebuilding every test binary.
    # Runners check out to the same path, so the archive's compiled-in binary
    # paths still resolve after extraction.
    name: build tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: cargo nextest archive --locked --archive-file tests.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: tests.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  cluster:
    name: multi-node cluster
    needs: [changes, build-tests]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARCHIVED: cargo nextest run --archive-file tests.tar.zst --extract-to . --extract-overwrite --workspace-remap . --profile ci --no-tests=fail
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Multi-node cluster suites
        run: make test-cluster NEXTEST="$ARCHIVED"
      - name: Keep the cluster report
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh test-cluster make test-cluster NEXTEST=archive
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-cluster
          path: target/junit
          if-no-files-found: error
          retention-days: 14

  acceptance:
    # Wall-clock, single-node upgrade and cluster upgrade suites, plus the
    # crane interoperability test: each used to pay for its own test build.
    name: acceptance
    needs: [changes, build-tests]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ARCHIVED: cargo nextest run --archive-file tests.tar.zst --extract-to . --extract-overwrite --workspace-remap . --profile ci --no-tests=fail
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: actions/download-artifact@v4
        with:
          name: nextest-archive
      - name: Wall-clock acceptance
        run: make test-slow NEXTEST="$ARCHIVED"
      - name: Keep the wall-clock report
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh test-slow make test-slow NEXTEST=archive
      - name: Single-node upgrade
        if: ${{ !cancelled() }}
        run: make test-upgrade-node NEXTEST="$ARCHIVED"
      - name: Keep the single-node upgrade report
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh test-upgrade-node make test-upgrade-node NEXTEST=archive
      - name: Cluster upgrade
        if: ${{ !cancelled() }}
        run: make test-upgrade-cluster NEXTEST="$ARCHIVED"
      - name: Keep the cluster upgrade report
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh test-upgrade-cluster make test-upgrade-cluster NEXTEST=archive
      - name: Install crane
        # Pinned release, checked against the digest in its checksums.txt.
        if: ${{ !cancelled() }}
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -fsSLo "$RUNNER_TEMP/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/crane"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/crane" crane
          echo "$RUNNER_TEMP/crane" >> "$GITHUB_PATH"
      - name: Standard registry clients
        if: ${{ !cancelled() }}
        run: make test-standard-clients NEXTEST="$ARCHIVED"
      - name: Keep the standard clients report
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh test-standard-clients make test-standard-clients NEXTEST=archive
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-acceptance
          path: target/junit
          if-no-files-found: error
          retention-days: 14

  ignored-evidence:
    # Every ignored test whose owner CI runs (a make gate or script named in
    # this file) must appear in one of the reports above. --no-tests=fail only
    # proves a filter matched something; this catches a test renamed out of
    # its gate's filter. See scripts/ci/ignored_owners.py.
    name: ignored-test evidence
    needs: [changes, linux, cluster, acceptance]
    if: ${{ always() && needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: evidence/junit
      - uses: actions/download-artifact@v4
        with:
          name: oci-interruption-evidence
          path: evidence/oci
      - name: Every CI-owned ignored test ran
        run: python3 scripts/ci/ignored_owners.py evidence evidence

  macos:
    name: portable macOS
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Lint every target, with all features and with none
        run: make lint
      - name: Portable tests
        run: make test
      - name: Keep the portable report
        if: ${{ !cancelled() }}
        run: scripts/ci/keep-junit.sh test make test
      - name: Doctests
        run: make test-doc
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-macos
          path: target/junit
          if-no-files-found: error
          retention-days: 14

  benchmarks:
    # Criterion output is uploaded, not gated, so pull requests only pay for
    # the release build when they touch the gossip protocol or its benches.
    name: benchmarks
    needs: changes
    if: needs.changes.outputs.gossip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: make bench
      - run: make bench-large
      - uses: actions/upload-artifact@v4
        with:
          name: criterion
          path: target/criterion
          if-no-files-found: error
          retention-days: 14
