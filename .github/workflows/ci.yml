name: CI

# Throwaway loop for #456: run the rootless adoption test repeatedly on the
# privileged runner with status diagnostics.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  linux:
    name: privileged Linux
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-privileged
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Install runtime and kernel test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs buildah busybox-static gcc clang iproute2 libbpf-dev linux-headers-$(uname -r) llvm nftables runc slirp4netns uidmap
      - name: Mount persistent BPF storage for kernel recovery tests
        run: mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
      - name: Permit rootless runc on Ubuntu AppArmor hosts
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Restore the pinned test images
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-images
          key: test-images-${{ runner.arch }}-${{ hashFiles('tests/fixtures/pinned-images.txt') }}
      - name: Warm the pinned test images
        # One fetch with retries, before any timed test. The suites then pull
        # from a loopback mirror of this digest-verified cache.
        run: make test-images TEST_IMAGE_CACHE="$RUNNER_TEMP/test-images"
      - name: Build the rootless test once
        run: cargo nextest run --profile ci --features ebpf --no-run
      - name: Loop the rootless adoption test (#456)
        run: |
          pass=0; fail=0
          for i in $(seq 1 ${LOOPS:-30}); do
            echo "=== iteration $i" | tee -a /tmp/reliaburger-456.log
            if RELIABURGER_ROOTLESS_RUNC_TESTS=1 cargo nextest run --profile ci --no-tests=fail --features ebpf --run-ignored=only -E 'test(normal_rootless_bun)' > /tmp/iter.log 2>&1; then
              pass=$((pass+1))
            else
              fail=$((fail+1)); echo "--- iteration $i failed"; grep -E "panicked|never answered|FAIL" /tmp/iter.log | head -5
            fi
          done
          echo "passed=$pass failed=$fail"
      - name: Diagnostics summary
        if: always()
        run: |
          wc -l /tmp/reliaburger-456.log || true
          grep -c " status " /tmp/reliaburger-456.log || true
          grep -E "===| status " /tmp/reliaburger-456.log | head -150 || true
          echo ---- slow ops
          grep " op " /tmp/reliaburger-456.log | sed -E 's/.*::(owned_[a-z_]+).*waited=([0-9]+)ms total=([0-9]+)ms.*/\1 \2 \3/' | awk '{n[$1]++; w[$1]+=$2; t[$1]+=$3; if($3>m[$1])m[$1]=$3} END{for(k in n) print k, n[k], "avgwait", w[k]/n[k], "avgtotal", t[k]/n[k], "max", m[k]}'
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-456
          path: /tmp/reliaburger-456.log
          retention-days: 3
