name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    # fix/** covers review PRs stacked on each other rather than on main.
    branches: [main, "codex/**", "fix/**"]

# PR updates supersede earlier checks. Main/tag runs each retain their own group.
# Fixed prefixes also keep reusable source CI separate from its release caller.
concurrency:
  group: source-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci

jobs:
  dependency-audit:
    name: dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@cargo-audit
      - run: make audit

  minimum-rust:
    name: minimum Rust 1.97.0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          key: minimum-rust-1.97.0
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get remove -y -qq buildah
          sudo apt-get install -y -qq clang libbpf-dev llvm
      - name: Check every target and feature with the locked graph
        run: cargo check --locked --all-targets --all-features
      - name: Test the minimum compiler with default features
        run: cargo nextest run --locked --profile ci --no-tests=fail
      - name: Test the minimum compiler without default features
        run: cargo nextest run --locked --profile ci --no-tests=fail --no-default-features

  portable:
    name: portable Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          key: portable
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get remove -y -qq buildah
          sudo apt-get install -y -qq clang libbpf-dev llvm
      - name: Format
        run: make fmt-check
      - name: Lint every target and feature
        run: make lint
      - name: Portable tests
        run: make test
      - name: Verify JUnit output
        run: test -s target/nextest/ci/junit.xml
      - name: No-default-feature tests
        run: make test-no-default
      - name: Doctests
        run: make test-doc
      - name: Executable examples
        run: make examples
      - name: Upload JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-portable
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  slow:
    name: wall-clock acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          key: slow
      - run: make test-slow

  linux:
    name: privileged Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-privileged
      - name: Install runtime and kernel test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs buildah busybox-static gcc clang iproute2 libbpf-dev linux-headers-$(uname -r) llvm nftables runc slirp4netns uidmap
      - name: Mount persistent BPF storage for kernel recovery tests
        run: mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
      - name: Permit rootless runc on Ubuntu AppArmor hosts
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Prove rootless port adoption
        run: make test-rootless-runc
      - name: Qualify actual Bun OCI interruptions
        run: scripts/release/qualify-oci-interruptions.sh
      - name: Retain OCI interruption evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oci-interruption-evidence
          path: /var/tmp/reliaburger-oci-interruptions.*/
          if-no-files-found: ignore
      - name: Run only provisioned Linux tests
        run: sudo -E env PATH="$PATH" NEXTEST_PROFILE=ci make test-linux

  cluster:
    name: multi-node cluster
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          key: cluster
      - run: make test-cluster

  upgrade-node:
    name: single-node upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          key: upgrade-node
      - run: make test-upgrade-node

  upgrade-cluster:
    name: cluster upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          key: upgrade-cluster
      - run: make test-upgrade-cluster

  macos:
    name: portable macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-portable
      - name: Lint every target and feature
        run: make lint
      - run: make test
      - run: make test-doc

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
        with:
          key: coverage
      - name: Remove provisioned container builder
        run: sudo apt-get remove -y -qq buildah
      - run: make coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: error

  benchmark-fast:
    name: fast benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-fast
      - run: make bench
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-fast
          path: target/criterion
          if-no-files-found: error

  benchmark-large:
    name: large benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-large
      - run: make bench-large
      - uses: actions/upload-artifact@v4
        with:
          name: criterion-large
          path: target/criterion
          if-no-files-found: error

  scale-10k:
    name: 10k-member scale acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: scale-10k
      - run: make bench-10k
