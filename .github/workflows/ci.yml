name: CI

on:
  workflow_call:
  push:
    # A push to a release's merge train runs everything on the merged result.
    branches: [main, "release-*"]
  pull_request:
    # fix/** covers review PRs stacked on each other rather than on main.
    # release-* is each release's merge train: PRs into it get the light set
    # (scripts/ci/select-jobs.sh), and the merge queue and the push to the
    # train run everything.
    branches: [main, "codex/**", "fix/**", "release-*"]
    # labeled lets a `full-ci` label start the heavy suites on any PR (on a
    # PR into a train, everything but the macOS shards).
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    # The merge queue on release-* tests each batch, merged onto the train,
    # with every job before any of it lands. It requires one check:
    # "ignored-test evidence", which waits for every other job.
    types: [checks_requested]
  schedule:
    # Nightly full run on main, including the benchmarks.
    - cron: "17 3 * * *"

# A newer push to a PR, or to a merge train, supersedes the older run: the
# newer commit contains the older one. Main, merge-queue and called runs each
# keep their own group; the queue cancels its own groups when it re-forms.
# Fixed prefixes also keep reusable source CI separate from its release caller,
# and github.workflow (the caller's name when called) keeps a retarget run
# (ci-retarget.yml) from cancelling the pull request's own run.
concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-') && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-')) }}

permissions:
  contents: read

# Caches: GitHub keeps 10 GB per repository. Jobs that build the same profile
# share one key, and only pushes to main save, even when tests fail. PRs,
# stacked or not, restore main's cache instead of evicting each other's.
# Release trains don't save either. rust-cache keys on the toolchain, the
# environment and Cargo.lock plus Cargo.toml (minus versions), so a train PR
# whose dependencies match main's gets a full hit, and one that changed them
# restores main's and rebuilds only the changed crates. The workspace crate
# itself, most of each job's compile time, is never cached. Saving from trains
# would need a push run per train merge and another ~5 GB of cache.
# Debug builds keep line tables only: backtraces still name files and lines,
# and each target cache is roughly half the size, so they all fit.
# Artefacts: reports are kept 14 days; release candidates keep their 90.
# Every owner retains current discovery, completion and JUnit together.
# Aggregation binds them to successful current-run producer outputs.

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  # Evidence binds to the commit this run checked out: the PR's test merge,
  # the pushed commit, or the merge queue's temporary group commit.
  EXPECTED_CHECKOUT_COMMIT: ${{ github.event.merge_group.head_sha || github.sha }}
  PYTHONDONTWRITEBYTECODE: '1'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    # Which job groups this run needs; see scripts/ci/select-jobs.sh.
    name: select jobs
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.select.outputs.code }}
      gossip: ${{ steps.select.outputs.gossip }}
      heavy: ${{ steps.select.outputs.heavy }}
      task_arrays: ${{ steps.select.outputs.task_arrays }}
      macos: ${{ steps.select.outputs.macos }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          # The PR event names the branch it targets; github.base_ref reported
          # main for a PR stacked on another branch (run 35921062344).
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          # A train's gate PR into main, or any PR from a train, runs everything.
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: scripts/ci/select-jobs.sh

  ci-policy:
    # The CI scripts' own tests (job selection, ignored-test owners, JUnit
    # keeping) and the rule that every #[ignore] names who runs it. Cheap,
    # so it runs on every change, documentation included.
    name: CI policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # test_shard_partition.py checks the macOS shard merge against what
      # the pinned nextest really lists, on a throwaway crate.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - name: Test the CI scripts
        run: make test-ci-scripts
      - name: Every ignored test names its owner
        run: make check-ignored

  dependency-audit:
    name: dependency advisory audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@cargo-audit
      - run: make audit

  lint:
    # Formatting and Clippy report on their own, a few minutes in, instead of
    # waiting behind the test suite.
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libbpf-dev llvm
      - name: Format
        run: make fmt-check
      - name: Lint every target, with all features and with none
        run: make lint

  demo-app:
    # The five-minute tour builds examples/demo/burger on a node. Its own Go
    # tests take seconds, so they run on every code change.
    name: demo app
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/demo/burger/go.mod
          cache: false
      - name: Vet and test the demo app
        working-directory: examples/demo/burger
        run: |
          go vet ./...
          go test ./...

  minimum-rust:
    # The declared minimum compiler must build every target with and without
    # default features. The stable jobs run the tests, so running them again
    # on 1.97 would only repeat the same suite.
    name: minimum Rust 1.97.0
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: minimum-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get remove -y -qq buildah
          sudo apt-get install -y -qq clang libbpf-dev llvm
      - name: Check every target and feature with the locked graph
        run: cargo check --locked --all-targets --all-features
      - name: Check every target without default features
        run: cargo check --locked --all-targets --no-default-features

  portable:
    outputs:
      portable_linux_sha256: ${{ steps.portable_linux.outputs.portable_linux_sha256 }}
    # The Linux portable suite runs once, instrumented: the same run is the
    # test gate, the coverage gate and the JUnit source.
    name: portable Linux
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145,cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: portable
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      # Cache cleanup may retain empty generated directories. Clear old
      # envelopes once; each fresh owner remains exclusive within this job.
      - name: Clear restored execution envelopes
        run: rm -rf -- target/contracts
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get remove -y -qq buildah
          sudo apt-get install -y -qq clang libbpf-dev llvm
      - name: Portable tests with line coverage
        id: portable_linux
        run: |
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate portable-linux --host linux --directory target/contracts/linux/portable-linux --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Retain portable-linux current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-portable-linux
          path: target/contracts/linux/portable-linux
          if-no-files-found: error
          retention-days: 14
      - name: Doctests
        run: make test-doc
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: warn
          retention-days: 14

  linux:
    outputs:
      rootless_linux_sha256: ${{ steps.rootless_linux.outputs.rootless_linux_sha256 }}
      linux_root_storage_sha256: ${{ steps.linux_root_storage.outputs.linux_root_storage_sha256 }}
      oci_interruptions_sha256: ${{ steps.oci_interruptions.outputs.oci_interruptions_sha256 }}
    name: privileged Linux
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-privileged
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Clear restored execution envelopes
        run: rm -rf -- target/contracts
      - name: Install runtime and kernel test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs buildah busybox-static gcc clang iproute2 libbpf-dev linux-headers-$(uname -r) llvm nftables runc slirp4netns uidmap
      - name: Mount persistent BPF storage for kernel recovery tests
        run: mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
      - name: Permit rootless runc on Ubuntu AppArmor hosts
        run: |
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Restore the pinned test images
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-images
          key: test-images-${{ runner.arch }}-${{ hashFiles('tests/fixtures/pinned-images.txt') }}
      - name: Warm the pinned test images
        # One fetch with retries, before any timed test. The suites then pull
        # from a loopback mirror of this digest-verified cache.
        run: make test-images TEST_IMAGE_CACHE="$RUNNER_TEMP/test-images"
      - name: Prove rootless port adoption
        id: rootless_linux
        run: |
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate rootless-linux --host linux --directory target/contracts/linux/rootless-linux --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Retain rootless-linux current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-rootless-linux
          path: target/contracts/linux/rootless-linux
          if-no-files-found: error
          retention-days: 14
      - name: Watch disk and memory during the OCI interruptions
        # Twice on 11 Oct the runner itself stopped answering in the next
        # step and GitHub kept no log at all (#800). Record the headroom
        # every 5 s; the report below prints the low-water marks.
        run: |
          nohup bash -c 'while :; do echo "$(date -u +%T) disk_kb=$(df -k --output=avail / | tail -1 | tr -d " ") mem_kb=$(awk "/^MemAvailable/ {print \$2}" /proc/meminfo) load=$(cut -d" " -f1 /proc/loadavg)"; sleep 5; done' > "$RUNNER_TEMP/oci-resources.log" 2>&1 < /dev/null &
          echo $! > "$RUNNER_TEMP/oci-resources.pid"
      - name: Qualify actual Bun OCI interruptions
        id: oci_interruptions
        # Normally five minutes; the driver allows each of its three binaries
        # 420 s. Fail the step well inside the job limit, so a hang keeps its
        # log, its evidence and the report below (#800).
        timeout-minutes: 25
        run: scripts/release/qualify-oci-interruptions.sh
      - name: Report the OCI interruptions' headroom and leftovers
        if: always()
        timeout-minutes: 3
        run: |
          kill "$(cat "$RUNNER_TEMP/oci-resources.pid")" 2>/dev/null || true
          echo "Lowest free disk and memory while the OCI interruptions ran:"
          sort -t= -k2 -n "$RUNNER_TEMP/oci-resources.log" | head -1 || true
          sort -t= -k3 -n "$RUNNER_TEMP/oci-resources.log" | head -1 || true
          if [ "${{ steps.oci_interruptions.outcome }}" != success ]; then
            ps -eo pid,ppid,pgid,stat,wchan:32,etime,args --forest || true
            # Kernel stacks of every uninterruptible task, and of every thread
            # of a test binary, Bun or owner that outlived the step.
            for pid in $(ps -eo pid=,stat=,args= | awk '$2 ~ /^D/ || /target\/debug\/(deps\/|bun)|upgrade-bin\/bun|__process-owner/ {print $1}'); do
              for task in /proc/"$pid"/task/*; do
                echo "== $task ($(sudo cat "$task"/comm 2>/dev/null), $(sudo cat "$task"/wchan 2>/dev/null))"
                sudo cat "$task"/stack 2>/dev/null || true
              done
            done
          fi
      - name: Retain oci-interruptions current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-oci-interruptions
          path: target/contracts/linux/oci-interruptions
          if-no-files-found: error
          retention-days: 14
      - name: Run only provisioned Linux tests
        id: linux_root_storage
        run: |
          sudo -E env PATH="$PATH" python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate linux-root-storage --host linux --directory target/contracts/linux/linux-root-storage --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Restore root-storage evidence ownership
        if: always()
        run: |
          if [ -d target/contracts/linux/linux-root-storage ]; then
            sudo chown -R "$(id -u):$(id -g)" -- target/contracts/linux/linux-root-storage
          fi
      - name: Retain linux-root-storage current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-linux-root-storage
          path: target/contracts/linux/linux-root-storage
          if-no-files-found: error
          retention-days: 14
  build-tests:
    outputs:
      archive_sha256: ${{ steps.archive.outputs.archive_sha256 }}
      archive_origin_sha256: ${{ steps.archive.outputs.archive_origin_sha256 }}
      archive_runtime_sha256: ${{ steps.archive.outputs.archive_runtime_sha256 }}
    # Compile the portable test binaries once. The acceptance jobs download
    # this nextest archive instead of each rebuilding every test binary.
    # Runners check out to the same path, so the archive's compiled-in binary
    # paths still resolve after extraction.
    name: build tests
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - id: archive
        run: >-
          python3 scripts/ci/workflow_adapter.py archive --root . --host linux
          --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID"
          --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: nextest-archive
          path: |
            tests.tar.zst
            archive-origin.json
            archive-runtime.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  cluster:
    outputs:
      cluster_tests_sha256: ${{ steps.cluster_tests.outputs.cluster_tests_sha256 }}
    name: multi-node cluster
    needs: [changes, build-tests]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - name: Download the test archive
        id: test_archive
        # One attempt normally takes a minute or two. One stalled for 13
        # minutes and pushed acceptance past its limit (#977), so each
        # attempt gets 5 minutes and a failed one is retried once.
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: nextest-archive
      - name: Retry downloading the test archive
        if: ${{ !cancelled() && steps.test_archive.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: nextest-archive
      - name: Extract the test archive once for every suite
        id: extract_archive
        # Each suite used to extract the 2.9 GB archive twice, to list its
        # tests and to run them (#1050). This checks the archive against the
        # build job's digest and extracts it once; every suite then reuses
        # the extracted build through nextest's build-reuse flags, naming
        # this step's receipt digest in its evidence.
        run: |
          mkdir -p target
          printf '%s\n' '${{ toJSON(needs) }}' > target/workflow-needs.json
          python3 scripts/ci/workflow_adapter.py extract --root . --host linux --needs target/workflow-needs.json --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Multi-node cluster suites
        id: cluster_tests
        run: |
          mkdir -p target
          printf '%s\n' '${{ toJSON(needs) }}' > target/workflow-needs.json
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate cluster-tests --host linux --directory target/contracts/linux/cluster-tests --needs target/workflow-needs.json --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT" --archive-extraction "${{ steps.extract_archive.outputs.archive_extraction_sha256 }}"
      - name: Retain cluster-tests current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-cluster-tests
          path: target/contracts/linux/cluster-tests
          if-no-files-found: error
          retention-days: 14
  acceptance:
    outputs:
      slow_tests_sha256: ${{ steps.slow_tests.outputs.slow_tests_sha256 }}
      upgrade_node_sha256: ${{ steps.upgrade_node.outputs.upgrade_node_sha256 }}
      upgrade_cluster_sha256: ${{ steps.upgrade_cluster.outputs.upgrade_cluster_sha256 }}
      standard_clients_sha256: ${{ steps.standard_clients.outputs.standard_clients_sha256 }}
    # Wall-clock, single-node upgrade and cluster upgrade suites, plus the
    # standard registry client tests (docker, podman, skopeo, crane): each
    # used to pay for its own test build.
    name: acceptance
    needs: [changes, build-tests]
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - name: Download the test archive
        id: test_archive
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          name: nextest-archive
      - name: Retry downloading the test archive
        if: ${{ !cancelled() && steps.test_archive.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          name: nextest-archive
      - name: Extract the test archive once for every suite
        id: extract_archive
        # Each suite used to extract the 2.9 GB archive twice, to list its
        # tests and to run them (#1050). This checks the archive against the
        # build job's digest and extracts it once; every suite then reuses
        # the extracted build through nextest's build-reuse flags, naming
        # this step's receipt digest in its evidence.
        run: |
          mkdir -p target
          printf '%s\n' '${{ toJSON(needs) }}' > target/workflow-needs.json
          python3 scripts/ci/workflow_adapter.py extract --root . --host linux --needs target/workflow-needs.json --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Wall-clock acceptance
        id: slow_tests
        run: |
          mkdir -p target
          printf '%s\n' '${{ toJSON(needs) }}' > target/workflow-needs.json
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate slow-tests --host linux --directory target/contracts/linux/slow-tests --needs target/workflow-needs.json --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT" --archive-extraction "${{ steps.extract_archive.outputs.archive_extraction_sha256 }}"
      - name: Retain slow-tests current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-slow-tests
          path: target/contracts/linux/slow-tests
          if-no-files-found: error
          retention-days: 14
      - name: Single-node upgrade
        id: upgrade_node
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target
          printf '%s\n' '${{ toJSON(needs) }}' > target/workflow-needs.json
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate upgrade-node --host linux --directory target/contracts/linux/upgrade-node --needs target/workflow-needs.json --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT" --archive-extraction "${{ steps.extract_archive.outputs.archive_extraction_sha256 }}"
      - name: Retain upgrade-node current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-upgrade-node
          path: target/contracts/linux/upgrade-node
          if-no-files-found: error
          retention-days: 14
      - name: Cluster upgrade
        id: upgrade_cluster
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target
          printf '%s\n' '${{ toJSON(needs) }}' > target/workflow-needs.json
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate upgrade-cluster --host linux --directory target/contracts/linux/upgrade-cluster --needs target/workflow-needs.json --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT" --archive-extraction "${{ steps.extract_archive.outputs.archive_extraction_sha256 }}"
      - name: Retain upgrade-cluster current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-upgrade-cluster
          path: target/contracts/linux/upgrade-cluster
          if-no-files-found: error
          retention-days: 14
      - name: Install crane
        # Pinned release, checked against the digest in its checksums.txt.
        if: ${{ !cancelled() }}
        env:
          CRANE_VERSION: v0.22.1
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          curl -fsSLo "$RUNNER_TEMP/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/$CRANE_VERSION/go-containerregistry_Linux_x86_64.tar.gz"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/crane"
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP/crane" crane
          echo "$RUNNER_TEMP/crane" >> "$GITHUB_PATH"
      - name: Prepare the host for docker, podman and skopeo
        # docker, podman and skopeo come with the runner image. The gate's
        # host check fails if one is missing and logs the versions it ran.
        # This step names the registry host and lets the tests install their
        # CA under certs.d.
        if: ${{ !cancelled() }}
        run: sudo scripts/standard-clients-host.sh --provision
      - name: Standard registry clients
        id: standard_clients
        if: ${{ !cancelled() }}
        run: |
          mkdir -p target
          printf '%s\n' '${{ toJSON(needs) }}' > target/workflow-needs.json
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate standard-clients --host linux --directory target/contracts/linux/standard-clients --needs target/workflow-needs.json --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT" --archive-extraction "${{ steps.extract_archive.outputs.archive_extraction_sha256 }}"
      - name: Retain standard-clients current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-standard-clients
          path: target/contracts/linux/standard-clients
          if-no-files-found: error
          retention-days: 14
  contract-boundaries:
    name: optimized contract boundaries
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    outputs:
      optimized_cron_sha256: ${{ steps.optimized_cron.outputs.optimized_cron_sha256 }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - name: Actual-source optimized cron boundaries
        id: optimized_cron
        run: |
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate optimized-cron --host linux --directory target/contracts/linux/optimized-cron --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Retain optimized-cron current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-linux-optimized-cron
          path: target/contracts/linux/optimized-cron
          if-no-files-found: error
          retention-days: 14

  ignored-evidence:
    # The final gate, and the one check the merge queue requires: it waits
    # for every other job, fails if any of them failed, and then checks that
    # every selected evidence owner completed its exact cases this run. It
    # always reports, so a skipped owner can never stand in for a pass.
    name: ignored-test evidence
    needs: [changes, ci-policy, dependency-audit, lint, demo-app, minimum-rust, portable, linux, build-tests, cluster, acceptance, contract-boundaries, macos, benchmarks, task-array-benchmarks]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Every job this run waited for succeeded or was not selected
        run: |
          mkdir -p target
          printf '%s\n' '${{ toJSON(needs) }}' > target/workflow-needs.json
          python3 scripts/ci/every_job.py --needs target/workflow-needs.json --event "$GITHUB_EVENT_NAME"
      - name: Download every evidence envelope
        id: evidence
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        continue-on-error: true
        with:
          pattern: contract-*
          path: incoming
          merge-multiple: false
      - name: Retry downloading every evidence envelope
        if: ${{ !cancelled() && steps.evidence.outcome == 'failure' }}
        uses: actions/download-artifact@v4
        timeout-minutes: 5
        with:
          pattern: contract-*
          path: incoming
          merge-multiple: false
      - name: Every selected owner and exact required case completed this run
        if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
        run: |
          python3 scripts/ci/workflow_adapter.py aggregate --root . \
            --manifest tests/contracts/manifest.json --directory incoming \
            --ignored-bindings tests/contracts/ignored-bindings.json \
            --needs target/workflow-needs.json --commit "$EXPECTED_CHECKOUT_COMMIT" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --event "$GITHUB_EVENT_NAME"

  macos:
    outputs:
      portable_darwin_1_sha256: ${{ steps.portable_darwin.outputs.portable_darwin_1_sha256 }}
      portable_darwin_2_sha256: ${{ steps.portable_darwin.outputs.portable_darwin_2_sha256 }}
      portable_darwin_3_sha256: ${{ steps.portable_darwin.outputs.portable_darwin_3_sha256 }}
    # The portable suite on macOS, split three ways by nextest hash partition
    # (SHARDS in scripts/ci/workflow_assembly.py). Each shard sets only its own
    # output; ignored-test evidence proves the three ran every test once.
    name: portable macOS (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos
          # Three shards would save the same cache three times.
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.shard == 1 }}
          cache-on-failure: true
      - name: Clear restored execution envelopes
        run: rm -rf -- target/contracts
      # One pass, all features: the macOS-only code is in it, and the lint
      # job runs the no-features pass on Linux (see lint-macos in Makefile).
      # One shard runs it.
      - name: Lint every target, with all features
        if: matrix.shard == 1
        run: make lint-macos
      - name: Portable tests
        id: portable_darwin
        run: |
          python3 scripts/ci/workflow_adapter.py produce --root . --manifest tests/contracts/manifest.json --gate portable-darwin --shard "${{ matrix.shard }}/3" --host darwin --directory "target/contracts/darwin/portable-darwin-${{ matrix.shard }}" --commit "$EXPECTED_CHECKOUT_COMMIT" --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" --github-output "$GITHUB_OUTPUT"
      - name: Retain portable-darwin current execution envelope
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-darwin-portable-darwin-${{ matrix.shard }}
          path: target/contracts/darwin/portable-darwin-${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 14
      # Doctests run on another shard than the lint, to even them out.
      - name: Doctests
        if: matrix.shard == 2
        run: make test-doc
  benchmarks:
    # Criterion output is uploaded, not gated, so pull requests only pay for
    # the release build when they touch the gossip protocol or its benches.
    name: benchmarks
    needs: changes
    if: needs.changes.outputs.gossip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - run: make bench
      - run: make bench-large
      - uses: actions/upload-artifact@v4
        with:
          name: criterion
          path: target/criterion
          if-no-files-found: error
          retention-days: 14

  task-array-benchmarks:
    # benches/task_arrays.rs: the leader's cost for a 1M-task array, the node
    # pool's overhead per task and this runner's fork/exec floor. Nightly on
    # main, and on pull requests that touch what it measures (select-jobs.sh).
    # Hosted runners vary from run to run, so it measures each benchmark
    # against main's last baseline relative to the rest of this run, and fails
    # only when one is more than twice as slow as the rest, or the run's
    # median is more than twice as slow (#857). A benchmark over that limit
    # is measured once more on its own, and fails only when it's over the
    # limit both times, so one disk stall isn't a regression (#936). The
    # on-disk ledger benchmark measures this runner's disk, which can stay
    # slow for the whole job, so it's report only; its tmpfs variant is gated
    # (#1038). The full Criterion output is kept for the trend #668 reads.
    name: task-array benchmarks
    needs: changes
    if: needs.changes.outputs.task_arrays == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: true
      - name: Restore the last baseline main saved
        uses: actions/cache/restore@v4
        with:
          path: target/task-array-baseline
          key: task-array-bench-${{ github.run_id }}
          restore-keys: task-array-bench-
      - run: make bench-task-arrays
      - name: Compare with main's baseline
        run: python3 scripts/ci/bench_baseline.py compare --criterion target/criterion --baseline target/task-array-baseline/baseline.json --max-ratio 2 --summary "$GITHUB_STEP_SUMMARY" --remeasure 'cargo bench --bench task_arrays --' --report-only storage/ledger_and_index_64k
      - name: Record this run as main's baseline
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/ci/bench_baseline.py save --criterion target/criterion --baseline target/task-array-baseline/baseline.json
      - name: Keep the baseline for the next run
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: target/task-array-baseline
          key: task-array-bench-${{ github.run_id }}
      # Kept 90 days, not 14: #668's cost trend is read from these.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: criterion-task-arrays
          path: |
            target/criterion
            target/task-array-baseline
          if-no-files-found: error
          retention-days: 90
