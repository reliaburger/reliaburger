name: CI

# Throwaway loop for #625: run the partition coverage test and the podinfo
# partition test repeatedly on the privileged runner, under CPU load, on the
# test-only commit (red) and the fix (fix). Closed, not merged.
on:
  pull_request:
    branches: [release-0-1-6]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  loop:
    name: loop ${{ matrix.variant }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [fix, red]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'red' && '4e61ffec9b7474692bdd966e5af2fe6ac05cfd2e' || '32ce1d3bb8b16cf8b14424435a0a9cc31e9fce3c' }}
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-privileged
          save-if: false
      - name: Install runtime and kernel test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs buildah busybox-static gcc clang iproute2 libbpf-dev linux-headers-$(uname -r) llvm nftables runc slirp4netns uidmap
      - name: Mount persistent BPF storage
        run: mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
      - name: Restore the pinned test images
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-images
          key: test-images-${{ runner.arch }}-${{ hashFiles('tests/fixtures/pinned-images.txt') }}
      - name: Warm the pinned test images
        run: make test-images TEST_IMAGE_CACHE="$RUNNER_TEMP/test-images"
      - name: Build
        run: cargo build --features ebpf --bin bun && cargo nextest list --features ebpf -E 'binary(kubernetes_demo) | binary(ebpf)' >/dev/null
      - name: Loop the partition test under load
        run: |
          for _ in 1 2 3; do (yes > /dev/null &); done
          passed=0; failed=0; cover_failed=0; podinfo_failed=0
          for i in $(seq 1 10); do
            if sudo -E env PATH="$PATH" NEXTEST_PROFILE=ci make test-linux \
                TEST_IMAGE_CACHE="$RUNNER_TEMP/test-images" \
                LINUX_EXCLUDE='& (test(podinfo_demo_feels_network_faults_between_frontend_and_redis) | test(partition_answers_only_once_every_source_instance_is_covered))' \
                > "run-$i.log" 2>&1; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
              echo "::warning::iteration $i failed"
              grep -q "FAIL .*partition_answers_only_once" "run-$i.log" && cover_failed=$((cover_failed+1))
              grep -q "FAIL .*podinfo_demo_feels_network_faults" "run-$i.log" && podinfo_failed=$((podinfo_failed+1))
              grep -E "kept reaching|reported in place|panicked|inject_fault|FAIL" "run-$i.log" | head -20 || true
            fi
          done
          line="RESULT ${{ matrix.variant }} shard ${{ matrix.shard }}: $passed of 10 iterations passed; coverage test failed $cover_failed, podinfo test failed $podinfo_failed"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
