name: CI

# Throwaway loop for #450: run the podinfo partition test repeatedly on the
# privileged runner, under CPU load, with the fix and on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NEXTEST_PROFILE: ci
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  loop:
    name: loop ${{ matrix.variant }} ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant: [fix, main]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.variant == 'main' && 'main' || github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.145
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-privileged
          save-if: false
      - name: Install runtime and kernel test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs buildah busybox-static gcc clang iproute2 libbpf-dev linux-headers-$(uname -r) llvm nftables runc slirp4netns uidmap
      - name: Mount persistent BPF storage
        run: mountpoint -q /sys/fs/bpf || sudo mount -t bpf bpf /sys/fs/bpf
      - name: Restore the pinned test images
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/test-images
          key: test-images-${{ runner.arch }}-${{ hashFiles('tests/fixtures/pinned-images.txt') }}
      - name: Warm the pinned test images
        run: make test-images TEST_IMAGE_CACHE="$RUNNER_TEMP/test-images"
      - name: Build
        run: cargo build --features ebpf --bin bun && cargo nextest list --features ebpf -E 'binary(kubernetes_demo)' >/dev/null
      - name: Loop the partition test under load
        run: |
          for _ in 1 2 3; do (yes > /dev/null &); done
          passed=0; failed=0
          for i in $(seq 1 10); do
            if sudo -E env PATH="$PATH" NEXTEST_PROFILE=ci make test-linux \
                TEST_IMAGE_CACHE="$RUNNER_TEMP/test-images" \
                LINUX_EXCLUDE='& binary(kubernetes_demo) & test(podinfo_demo_feels_network_faults_between_frontend_and_redis)' \
                > "run-$i.log" 2>&1; then
              passed=$((passed+1))
            else
              failed=$((failed+1))
              echo "::warning::iteration $i failed"
              grep -E "kept reaching|panicked|under partition|inject_fault" "run-$i.log" | head -20
            fi
          done
          echo "RESULT ${{ matrix.variant }} shard ${{ matrix.shard }}: $passed passed, $failed failed"
          echo "RESULT ${{ matrix.variant }} shard ${{ matrix.shard }}: $passed passed, $failed failed" >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]
