name: Mutants

# Mutation testing with cargo-mutants (#1584; docs/testing.md, "Mutation
# testing"). It changes the code a pull request touches, one small edit at a
# time (a `>` becomes `>=`, a function returns `Default::default()`), and
# runs the tests against each. A mutant no test notices is a missing test:
# the job summary lists each one with a link that opens a pre-filled
# `missed-mutant` issue, which a person files. Nothing here posts to GitHub.
#
# It is its own workflow, like fuzz.yml, and it doesn't run on pull requests:
# a job per train PR held a Linux runner for up to 75 minutes while the
# train's own CI queued behind it (24 November 2026). It runs every night
# instead, on the newest release train (where work lands before main), or on
# main when no train is ahead of it, and mutates what landed in the last day.
# It runs on Linux only and doesn't fail on a missed mutant. Each mutant
# rebuilds the crate and runs its module's unit tests, a few minutes apiece,
# so a run tests at most MUTANTS_MAX mutants, a round-robin sample over every
# file the day changed (scripts/ci/mutants_plan.py). A whole-crate run is
# about 27,000 mutants, far beyond any runner.

on:
  schedule:
    # Every night, when the runners are quiet.
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      files:
        description: Glob of files to mutate, e.g. src/council/** (empty means the newest train's last day of changes)
        default: ""
      max:
        description: Most mutants to test
        default: "12"

permissions:
  contents: read

concurrency:
  group: mutants-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # A mutant only has to build and fail; no debugger reads these binaries,
  # and no debug info makes each rebuild's link faster.
  CARGO_PROFILE_DEV_DEBUG: "0"
  MUTANTS_MAX: ${{ github.event_name == 'schedule' && '60' || inputs.max }}
  # The test step's own budget, inside the job's limit, so the summary and
  # the artefact still come out when the mutants take longer than planned.
  MUTANTS_MINUTES: "300"

jobs:
  mutants:
    name: mutants in the change
    runs-on: ubuntu-24.04
    # Run 42213963003, a pull request with a cold cache: 40 s of set-up, a
    # 13.5-minute baseline build, then 7.5 minutes a mutant without
    # incremental builds. The test step stops itself at MUTANTS_MINUTES; this
    # limit leaves room for the summary and the artefact after it.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-nextest@0.9.151,cargo-mutants@27.1.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: mutants
          cache-on-failure: true
      - name: Prepare portable build host
        run: |
          sudo apt-get update -qq
          sudo apt-get remove -y -qq buildah
          sudo apt-get install -y -qq clang libbpf-dev llvm
      # The newest release train, when it has work main doesn't, else main.
      # Release trains are release-<x>-<y>-<z>; sort -V puts the newest last.
      - name: Choose what to mutate
        id: choose
        env:
          FILES: ${{ inputs.files }}
        run: |
          ref=origin/main
          train=$(git branch -r --list 'origin/release-*' | sed 's/^ *//' | sort -V | tail -n 1)
          if [ -n "$train" ] && [ -n "$(git rev-list -1 origin/main.."$train")" ]; then
            ref=$train
          fi
          echo "mutating $ref" >&2
          git checkout --quiet --detach "$ref"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ -n "$FILES" ]; then
            echo "SELECT_FLAG=--file" >> "$GITHUB_ENV"
            echo "SELECT_VALUE=$FILES" >> "$GITHUB_ENV"
            exit 0
          fi
          diff="$RUNNER_TEMP/change.diff"
          since=$(git rev-list -1 --first-parent --before='1 day ago' HEAD)
          # A train younger than a day: everything since it left main.
          [ -n "$since" ] || since=$(git merge-base origin/main HEAD)
          git diff "$since" HEAD -- src/ > "$diff"
          if [ ! -s "$diff" ]; then
            echo "nothing under src/ landed on $ref in the last day" >&2
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "SELECT_FLAG=--in-diff" >> "$GITHUB_ENV"
          echo "SELECT_VALUE=$diff" >> "$GITHUB_ENV"
      - name: List and plan
        id: plan
        if: steps.choose.outputs.skip != 'true'
        run: |
          cargo mutants --list "$SELECT_FLAG" "$SELECT_VALUE" | tee "$RUNNER_TEMP/mutants.list"
          python3 scripts/ci/mutants_plan.py plan --list "$RUNNER_TEMP/mutants.list" --max "$MUTANTS_MAX" --github-output "$GITHUB_OUTPUT"
      # Exit 2 is a missed mutant and 3 a timeout: findings, not failures.
      # 124 is `timeout` ending the run at MUTANTS_MINUTES; cargo-mutants
      # appends each result to mutants.out as it finishes, so the summary
      # reports what got done. Anything else (the unmutated tree failing its
      # tests, say) fails. A module with no unit tests is a warning: every
      # mutant in it is missed.
      - name: Test the mutants
        if: steps.plan.outputs.count != '0'
        env:
          SHARDS: ${{ steps.plan.outputs.shards }}
          FILTER: ${{ steps.plan.outputs.filter }}
          # rust-cache turns incremental compilation off, so each mutant
          # rebuilt the whole crate: 442 to 456 s a mutant on run
          # 42213963003. Each mutant changes one line, which is what
          # incremental compilation is for.
          CARGO_INCREMENTAL: "1"
        run: |
          filter=()
          if [ -n "$FILTER" ]; then filter=(-E "$FILTER"); fi
          status=0
          timeout --signal=INT --kill-after=2m "${MUTANTS_MINUTES}m" \
            cargo mutants "$SELECT_FLAG" "$SELECT_VALUE" --in-place \
            --shard "0/$SHARDS" --sharding round-robin --output "$RUNNER_TEMP" \
            -- --lib --no-tests=warn "${filter[@]}" || status=$?
          case "$status" in
            0|2|3) ;;
            124) echo "MUTANTS_STOPPED=--stopped" >> "$GITHUB_ENV" ;;
            *) exit "$status" ;;
          esac
      - name: Summarise
        if: always() && steps.plan.outcome == 'success'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/ci/mutants_plan.py summary --list "$RUNNER_TEMP/mutants.list" --max "$MUTANTS_MAX" \
            --results "$RUNNER_TEMP/mutants.out" --repository "$REPOSITORY" --commit "$COMMIT" \
            ${MUTANTS_STOPPED:-} >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: ${{ runner.temp }}/mutants.out
          if-no-files-found: ignore
          retention-days: 14
