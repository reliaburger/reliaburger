name: Dependency security

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: weekly RustSec advisory audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@073e1fd0bc889c9aee68dbaaa927cde1b5653a83 # v2.90.11
        with:
          tool: cargo-audit
      - run: make audit

  # How far Cargo.lock lags crates.io. Informational: it never fails, and the
  # refresh itself is a release step (docs/releasing.md) and Dependabot's job.
  outdated:
    name: weekly dependency lag report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.98.0
      - name: Report the lag in the job summary
        run: |
          {
            echo '## Dependency lag'
            echo
            echo '```'
            make outdated 2>&1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
