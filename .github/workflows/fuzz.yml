name: Fuzz

# Every decoder that reads bytes from another machine has a cargo-fuzz target
# (fuzz/, bodies in src/fuzz/, #1398). Nightly, each one runs for five
# minutes; a run by hand takes any budget. Pull requests don't run it
# (maintainer decision of 24 November 2026): the job took 14 to 33 minutes of
# a starved runner pool, and the release gate doesn't use it. Any crash fails
# the job and its input is kept as an artefact. A nightly crash gets an issue
# the same day, like a flake (docs/flakes.md), and becomes a unit test before
# it's fixed (docs/testing.md, "Fuzzing").
#
# It is its own workflow, like flakes.yml: cargo-fuzz needs nightly Rust,
# which nothing in ci.yml uses, and the evidence gate there waits on every
# job it holds. The stable half (every target over its checked-in corpus)
# runs in ci.yml's portable suite, on every pull request.
#
# It fuzzes the newest release train that has work main doesn't, else main,
# the way mutants.yml and macos-nightly.yml pick their branch: train work
# lands on release-* first, and a scheduled run checks out main (#2482).
# GitHub runs a scheduled workflow from main's copy only, so a change to
# this file takes effect once it's on main (docs/releasing.md).

on:
  schedule:
    - cron: "29 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: "300"
      ref:
        description: Branch or commit to fuzz (empty means the newest train, else main)
        default: ""

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.run_id }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # A dated nightly, so the build cache below survives from one night to the
  # next; a floating one changes its key every day. Move it forward by hand
  # (and the cache with it) when a newer nightly is needed.
  FUZZ_TOOLCHAIN: nightly-2026-10-28

jobs:
  fuzz:
    name: fuzz every decoder
    runs-on: ubuntu-24.04
    # Uncached: a 33-minute sanitizer build (run 40697356210), five minutes
    # a target and about 3 minutes of set-up, with half that again to spare
    # (scripts/ci/test_fuzz_workflow.py checks the sum for the targets in
    # fuzz/fuzz_targets/). Cached, only reliaburger itself rebuilds (14
    # minutes): a path dependency's fingerprint is its files' mtimes, which
    # every checkout resets.
    timeout-minutes: 185
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Release trains are release-<x>-<y>-<z>; sort -V puts the newest last.
      - name: Choose what to fuzz
        env:
          REF: ${{ inputs.ref }}
        run: |
          ref=${REF:-}
          if [ -z "$ref" ]; then
            ref=origin/main
            train=$(git branch -r --list 'origin/release-*' | sed 's/^ *//' | sort -V | tail -n 1)
            if [ -n "$train" ] && [ -n "$(git rev-list -1 origin/main.."$train")" ]; then
              ref=$train
            fi
          elif git rev-parse --verify --quiet "origin/$ref" >/dev/null; then
            ref=origin/$ref
          fi
          git checkout --quiet --detach "$ref"
          echo "fuzzing $ref at $(git rev-parse HEAD)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      # rust-cache hashes every installed toolchain into its key, and the
      # runner image's own stable changes as images roll out (1.99.0, then
      # 1.99.1, between two attempts of one run). Keep only ours.
      - name: Keep only the fuzzing toolchain
        run: |
          for toolchain in $(rustup toolchain list --quiet); do
            case "$toolchain" in
              "$FUZZ_TOOLCHAIN"-*) ;;
              *) rustup toolchain uninstall "$toolchain" ;;
            esac
          done
          rustup toolchain list
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.2
      # The sanitizer build of the whole crate is most of the job. One key
      # serves the nightly run and runs by hand, and both save it. A run
      # that fuzzes a train saves under main's scope too, which is what we
      # want: this workflow is the cache's only reader, and the next night
      # fuzzes the same train. rust-cache's key hashes the lockfiles, so a
      # train's build is an entry beside main's, never a replacement.
      #
      # The key also names the coverage wrapper, since Cargo doesn't
      # fingerprint a RUSTC_WRAPPER. From 17 Nov 2026, main's nightly saved
      # crates built through fuzz/rustc-coverage.sh, and pull requests (which
      # ran this then) into a train that didn't have the wrapper yet restored
      # them. Each rebuilt
      # the whole crate (33 minutes instead of 11) and then took about 20
      # minutes per 30-second target, so every one hit the job's limit
      # (#2125).
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz
          key: coverage-${{ hashFiles('fuzz/rustc-coverage.sh') }}
          cache-on-failure: true
          # reliaburger is a path dependency here, which rust-cache would
          # otherwise prune as a local crate; on a nightly with no new
          # commits its build is reusable whole.
          cache-workspace-crates: true
      # The Makefile builds with FUZZ_CODEGEN_UNITS (64): with cargo-fuzz's
      # default of one unit, reliaburger's rustc alone needs 31 GB and the
      # 16 GB runner is reclaimed mid-build (#1839).
      - name: Run each target
        env:
          FUZZ_SECONDS: ${{ inputs.seconds || '300' }}
        run: make fuzz-smoke
      - name: Report executions and coverage per target
        if: always()
        run: |
          {
            echo '## Fuzzing'
            echo
            echo '| Target | Coverage counters | Last status line |'
            echo '| --- | --- | --- |'
            for log in fuzz/target/logs/*.log; do
              [ -e "$log" ] || continue
              # Only the decoder crates are instrumented (#1953): a count in
              # the millions means the whole dependency tree is again.
              counters=$(grep -oE '[0-9]+ inline 8-bit counters' "$log" | head -n 1 | cut -d' ' -f1)
              line=$(grep -E '^#[0-9]+' "$log" | tail -n 1)
              echo "| $(basename "$log" .log) | ${counters} | \`${line}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep any crashing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            fuzz/artifacts/
            fuzz/target/logs/
          if-no-files-found: ignore
          retention-days: 30
