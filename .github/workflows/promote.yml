name: Promote qualified release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag pointing to the qualified candidate commit
        required: true
        type: string
      candidate_run:
        description: Successful manual Build & Release run that produced the candidate
        required: true
        type: string
      qualified_digest:
        description: SHA-256 of candidate.json recorded during completed qualification
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: promote-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  promote:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      QUALIFIED_DIGEST: ${{ inputs.qualified_digest }}
    steps:
      # Scripts come from main (the workflow's own ref), never from the tag:
      # this job holds a write token, and anyone who can push a tag could
      # otherwise put their own candidate.py in front of it.
      - uses: actions/checkout@v4
      - name: Check version and capture the tagged source commit
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "tag must look like v1.2.3: $RELEASE_TAG" >&2; exit 1; }
          # stage.yml's pre-releases are tagged staging-v1.2.3-RUN-ATTEMPT and
          # nightly-v1.2.3-RUN-ATTEMPT, which the pattern above refuses; these
          # also refuse a hand-made v1.2.3-staging or v1.2.3-nightly.
          [[ "$RELEASE_TAG" != *staging* ]] \
            || { echo "staging tags are never promoted: $RELEASE_TAG" >&2; exit 1; }
          [[ "$RELEASE_TAG" != *nightly* ]] \
            || { echo "nightly tags are never promoted: $RELEASE_TAG" >&2; exit 1; }
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git show "refs/tags/$RELEASE_TAG:Cargo.toml" | python3 -c '
          import os, sys, tomllib
          expected = "v" + tomllib.load(sys.stdin.buffer)["package"]["version"]
          assert os.environ["RELEASE_TAG"] == expected, f"tag must match {expected}"
          '
          printf 'CANDIDATE_COMMIT=%s\n' "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" >> "$GITHUB_ENV"
      - name: Download and verify the qualified candidate
        run: |
          python3 scripts/release/candidate.py fetch --directory dist \
            --version "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT" --run-id "$CANDIDATE_RUN" \
            --qualified-digest "$QUALIFIED_DIGEST"
      - name: Check every asset carries the candidate build's attestation
        # Read-only: what a stranger will run against the published files
        # (#1583). A candidate built before attestations, or by any workflow,
        # branch or repository but main's build.yml, stops here, before a
        # draft exists.
        run: |
          for asset in dist/*; do
            gh attestation verify "$asset" --repo "$RELEASE_REPOSITORY" \
              --signer-workflow "$RELEASE_REPOSITORY/.github/workflows/build.yml" \
              --source-ref refs/heads/main >/dev/null \
              || { echo "no build provenance attestation for $(basename "$asset")" >&2; exit 1; }
            echo "attested: $(basename "$asset")"
          done
      - name: Upload unchanged assets to a new draft
        run: |
          gh release create "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --verify-tag --draft --title "$RELEASE_TAG" --generate-notes dist/*
      - name: Verify uploaded assets and publish
        run: |
          python3 scripts/release/candidate.py verify-upload --directory dist \
            --version "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY" \
            --commit "$CANDIDATE_COMMIT" --run-id "$CANDIDATE_RUN" \
            --qualified-digest "$QUALIFIED_DIGEST"
          gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --verify-tag --draft=false --latest

  homebrew-tap:
    # The tap's formula pins the published relish binaries (#1583). It runs
    # only after publication, in a job of its own, so a tap that fails to
    # update never touches the release, and it reads only the published
    # candidate.json, checked against the qualified digest. The token is a
    # secret of the `release` environment, which only main can reach.
    # Without it the job says so and succeeds. Each published relish binary,
    # checked against that record, is also packed as a bottle: without one,
    # Homebrew treats the formula as a build from source and demands current
    # Command Line Tools though nothing compiles. The bottles go to a release
    # of the tap's own, so this job never needs write access here.
    needs: promote
    if: github.ref == 'refs/heads/main'
    environment: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      QUALIFIED_DIGEST: ${{ inputs.qualified_digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Write the bottles and formula from the published release
        run: |
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --pattern candidate.json --pattern 'relish-*' --dir published
          python3 scripts/release/homebrew.py bottles --record published/candidate.json \
            --qualified-digest "$QUALIFIED_DIGEST" --binaries published --output bottles
          python3 scripts/release/homebrew.py formula --record published/candidate.json \
            --qualified-digest "$QUALIFIED_DIGEST" --bottles bottles/bottles.json --output relish.rb
          { echo '### Homebrew formula'; echo '```ruby'; cat relish.rb; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Push the bottles and formula to the tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          python3 scripts/release/homebrew.py publish --formula relish.rb --version "$RELEASE_TAG" \
            --bottles bottles

  mcp-registry-entry:
    # The MCP Registry entry for this release (#1695): the tag's server.json
    # plus one `mcpb` package per relish platform, each with the SHA-256 the
    # published candidate.json records for its bundle. Publishing it needs
    # the maintainer's GitHub login to the organisation, so this job only
    # writes it, to the run summary and as an artefact; the maintainer runs
    # `mcp-publisher publish` with it (docs/releasing.md).
    needs: promote
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      QUALIFIED_DIGEST: ${{ inputs.qualified_digest }}
    steps:
      - uses: actions/checkout@v4
      - name: Write the entry from the published release
        run: |
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          git show "refs/tags/$RELEASE_TAG:server.json" > tagged-server.json
          gh release download "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" \
            --pattern candidate.json --dir published
          mkdir registry
          python3 scripts/release/mcp_registry.py --record published/candidate.json \
            --server tagged-server.json --qualified-digest "$QUALIFIED_DIGEST" \
            --output registry/server.json
          { echo '### MCP Registry entry'; echo '```json'; cat registry/server.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the entry for the maintainer to publish
        uses: actions/upload-artifact@v4
        with:
          name: mcp-registry-server-json
          path: registry/server.json
          if-no-files-found: error
          retention-days: 90
