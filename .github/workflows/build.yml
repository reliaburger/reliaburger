name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate-release:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          tinytex: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Build PDFs
        run: make pdf

      - name: Upload PDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reliaburger-pdfs
          path: docs/_book/*.pdf

  test-packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Test signing and metadata with ephemeral keys
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'
      - name: Check release tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PYCODE'
          import os, tomllib
          with open("Cargo.toml", "rb") as source:
              expected = "v" + tomllib.load(source)["package"]["version"]
          assert os.environ["RELEASE_TAG"] == expected, f"tag must match {expected}"
          PYCODE

  build-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            suffix: linux-aarch64
            runner: ubuntu-22.04-arm
            arguments: --features ebpf --bin bun --bin relish
          - target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            runner: ubuntu-22.04
            arguments: --features ebpf --bin bun --bin relish
          - target: aarch64-apple-darwin
            suffix: macos-aarch64
            runner: macos-15
            arguments: --bin relish
          - target: x86_64-apple-darwin
            suffix: macos-x86_64
            runner: macos-15-intel
            arguments: --bin relish
    runs-on: ${{ matrix.runner }}
    env:
      RELIABURGER_GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Install native Linux eBPF build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang llvm libbpf-dev
      - name: Build locked release binaries
        run: cargo build --locked --release --target ${{ matrix.target }} ${{ matrix.arguments }}
      - name: Smoke test and package native binaries
        shell: bash
        run: |
          mkdir -p dist
          target/${{ matrix.target }}/release/relish --version
          cp target/${{ matrix.target }}/release/relish dist/relish-${{ matrix.suffix }}
          if [ "${{ runner.os }}" = Linux ]; then
            target/${{ matrix.target }}/release/bun --version
            cp target/${{ matrix.target }}/release/bun dist/bun-${{ matrix.suffix }}
          fi
      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.suffix }}
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-release, build-pdf, build-binaries, test-packaging]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download PDFs
        uses: actions/download-artifact@v4
        with:
          name: reliaburger-pdfs
          path: dist
      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          merge-multiple: true
          path: dist
      - name: Mirror checksum-pinned Ubuntu guest images
        run: python3 scripts/release/fetch_guest_images.py --directory dist
      - name: Sign complete matrix and generate release metadata
        env:
          RELIABURGER_RELEASE_KEY: ${{ secrets.RELIABURGER_RELEASE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/release/package.py --directory dist
          --version "$RELEASE_TAG" --repository "$RELEASE_REPOSITORY"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
