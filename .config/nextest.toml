test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'binary(integration) | binary(placement) | binary(job_recovery)'
test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'binary(self_upgrade) | binary(self_upgrade_cluster)'
test-group = "upgrade-heavy"
slow-timeout = { period = "120s", terminate-after = 3 }

# Same exclusivity as the default profile: node pressure measures the
# whole node.
[[profile.ci.overrides]]
filter = 'binary(node_pressure)'
threads-required = "num-test-threads"

# Registry crash acceptance includes an intentional 30-second lease expiry,
# real TLS enrolment and a three-voter election. Serialise the physical cluster
# fixtures and allow their explicit recovery deadlines to run under nextest.
[[profile.default.overrides]]
filter = 'binary(registry_recovery) & (test(=expired_registry_lease_recovers_after_bun_sigkill_and_preserves_shared_content) | test(=new_leader_retains_registry_cleanup_until_the_killed_writer_returns))'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'binary(registry_recovery) & (test(=expired_registry_lease_recovers_after_bun_sigkill_and_preserves_shared_content) | test(=new_leader_retains_registry_cleanup_until_the_killed_writer_returns))'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 4 }

# Registry durability (#697) waits out several one-minute heal ticks on a
# three-node TLS cluster, before and after killing the pushing node.
[[profile.default.overrides]]
filter = 'binary(registry_durability)'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 15 }

[[profile.ci.overrides]]
filter = 'binary(registry_durability)'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 15 }

# Crash-recovery acceptance kills real Bun and owner processes and reboots
# their kernel state. The cases share runc, bpffs and cgroup roots, so they
# run one at a time, with room for the three-node upgrade case.
[[profile.default.overrides]]
filter = 'binary(oci_crash)'
test-group = "crash-recovery"
slow-timeout = { period = "60s", terminate-after = 4 }

# Crash-recovery acceptance kills real Bun and owner processes and reboots
# their kernel state. The cases share runc, bpffs and cgroup roots, so they
# run one at a time, with room for the three-node upgrade case.
[[profile.ci.overrides]]
filter = 'binary(oci_crash)'
test-group = "crash-recovery"
slow-timeout = { period = "60s", terminate-after = 4 }

# Power-cut fixtures run only through scripts/release/qualify-storage-power-cut.sh,
# which drives each phase on a disposable VM. They are ignored, and no Make
# target selects their binary; should a runner pick them up anyway, keep them
# in the serial crash-recovery group, because prepare starts worker processes.
[[profile.default.overrides]]
filter = 'binary(power_cut)'
test-group = "crash-recovery"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.ci.overrides]]
filter = 'binary(power_cut)'
test-group = "crash-recovery"
slow-timeout = { period = "60s", terminate-after = 5 }
