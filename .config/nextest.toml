# 0.9.145 fixes sibling capture-pipe inheritance on Apple platforms.
nextest-version = "0.9.145"

[store]
dir = "target/nextest"

[profile.default]
retries = 0
leak-timeout = { period = "100ms", result = "fail" }
fail-fast = true
status-level = "leak"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
retries = 0
leak-timeout = { period = "100ms", result = "fail" }
fail-fast = false
status-level = "leak"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 2 }
junit = { path = "junit.xml" }

[test-groups]
host-network = { max-threads = 1 }
cluster-heavy = { max-threads = 1 }
process-heavy = { max-threads = 2 }
upgrade-heavy = { max-threads = 1 }
crash-recovery = { max-threads = 1 }

# Each scripted demo (scripts/demo/) starts its own cluster and walks
# several rollouts or GitOps syncs, each waiting on real health checks.
[[profile.default.overrides]]
filter = 'binary(demos)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The podinfo demo pulls three real images on a cold cache before it can
# check anything, so it gets longer than the other host-network tests.
[[profile.default.overrides]]
filter = 'binary(kubernetes_demo)'
test-group = "host-network"
slow-timeout = { period = "120s", terminate-after = 5 }

# Memory autoscaling waits for a complete one-minute rollup to reach the
# leader on top of a runc pull and start. The first matching override wins,
# so this precedes the host-network timeout its `runc_` name also matches.
[[profile.default.overrides]]
filter = 'binary(autoscale_memory)'
test-group = "host-network"
slow-timeout = { period = "120s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'binary(ebpf) | binary(owned_network) | binary(owned_runc) | binary(owned_rootless) | test(/(runc_|_runc|runc::|netns|btrfs|buildah|image_pull)/)'
test-group = "host-network"
slow-timeout = { period = "60s", terminate-after = 2 }

# The 0.2.4 exit tests (#1126) each kill a leader or a node, then wait
# for an election, a GitOps poll or a controller's failover on top of
# cluster start-up. The first matching override wins, so this precedes the
# cluster-heavy one below.
[[profile.default.overrides]]
filter = 'binary(cluster_failover) & test(/^(the_platform_policies_hold_through_apply_gitops_and_a_leader_kill|an_admin_removes_a_policy_that_denies_everything_through_any_node|a_controller_fails_a_templated_database_pair_over_when_its_node_dies)$/)'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 5 }

[[profile.default.overrides]]
filter = 'binary(cluster_failover) | binary(council_self_healing) | binary(council_disaster_recovery) | binary(cluster_gossip) | binary(reporting_tcp) | binary(cluster_task_arrays)'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 2 }

# The real-collector autoscale test waits for a complete one-minute rollup
# window to reach the leader (60–120 s) on top of cluster start-up.
[[profile.default.overrides]]
filter = 'binary(placement) & test(autoscaler_scales_up_from_real_collector_cpu)'
test-group = "process-heavy"
slow-timeout = { period = "120s", terminate-after = 3 }

# The jobs catalogue runs a real cron case, which waits for the next UTC
# minute, then releases each job lease once the leader has settled its
# cancelled deployment. A late minute boundary plus coverage
# instrumentation can take it past a minute.
[[profile.default.overrides]]
filter = 'binary(relish_test_catalogue) & test(secure_catalogue_node_jobs_have_durable_ownership_and_confirmed_cleanup)'
test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

# Killing a shell with 400 sleeping children, thirty times (#916), holds
# 400 processes at a time and takes several seconds.
[[profile.default.overrides]]
filter = 'test(/a_shell_waiting_on_killed_children_as_killed$/)'
test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'binary(integration) | binary(placement) | binary(job_recovery)'
test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'binary(self_upgrade) | binary(self_upgrade_cluster)'
test-group = "upgrade-heavy"
slow-timeout = { period = "120s", terminate-after = 3 }

# Node pressure asserts on whole-node memory usage; any concurrently
# running test binary churns that measurement by hundreds of megabytes.
# Reserve every test thread so it runs alone.
[[profile.default.overrides]]
filter = 'binary(node_pressure)'
threads-required = "num-test-threads"

# Each scripted demo (scripts/demo/) starts its own cluster and walks
# several rollouts or GitOps syncs, each waiting on real health checks.
[[profile.ci.overrides]]
filter = 'binary(demos)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The podinfo demo pulls three real images on a cold cache before it can
# check anything, so it gets longer than the other host-network tests.
[[profile.ci.overrides]]
filter = 'binary(kubernetes_demo)'
test-group = "host-network"
slow-timeout = { period = "120s", terminate-after = 5 }

# Memory autoscaling waits for a complete one-minute rollup to reach the
# leader on top of a runc pull and start. The first matching override wins,
