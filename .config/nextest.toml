[store]
dir = "target/nextest"

[profile.default]
retries = 0
fail-fast = true
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
retries = 0
fail-fast = false
status-level = "slow"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 2 }
junit = { path = "junit.xml" }

[test-groups]
host-network = { max-threads = 1 }
cluster-heavy = { max-threads = 1 }
process-heavy = { max-threads = 2 }
upgrade-heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(ebpf) | test(/(runc|netns|btrfs|buildah|image_pull)/)'
test-group = "host-network"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary(cluster_failover) | binary(council_self_healing) | binary(council_disaster_recovery) | binary(cluster_gossip) | binary(reporting_tcp)'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary(integration) | binary(placement) | binary(chaos)'
test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'binary(self_upgrade) | binary(self_upgrade_cluster)'
test-group = "upgrade-heavy"
slow-timeout = { period = "120s", terminate-after = 3 }

# Node pressure asserts on whole-node memory usage; any concurrently
# running test binary churns that measurement by hundreds of megabytes.
# Reserve every test thread so it runs alone.
[[profile.default.overrides]]
filter = 'binary(node_pressure)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'binary(ebpf) | test(/(runc|netns|btrfs|buildah|image_pull)/)'
test-group = "host-network"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'binary(cluster_failover) | binary(council_self_healing) | binary(council_disaster_recovery) | binary(cluster_gossip) | binary(reporting_tcp)'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'binary(integration) | binary(placement) | binary(chaos)'
test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'binary(self_upgrade) | binary(self_upgrade_cluster)'
test-group = "upgrade-heavy"
slow-timeout = { period = "120s", terminate-after = 3 }

# Same exclusivity as the default profile: node pressure measures the
# whole node.
[[profile.ci.overrides]]
filter = 'binary(node_pressure)'
threads-required = "num-test-threads"
