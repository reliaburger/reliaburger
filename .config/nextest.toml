# 0.9.145 fixes sibling capture-pipe inheritance on Apple platforms.
nextest-version = "0.9.145"

[store]
dir = "target/nextest"

[profile.default]
retries = 0
leak-timeout = { period = "100ms", result = "fail" }
fail-fast = true
status-level = "leak"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
retries = 0
leak-timeout = { period = "100ms", result = "fail" }
fail-fast = false
status-level = "leak"
final-status-level = "slow"
slow-timeout = { period = "30s", terminate-after = 2 }
junit = { path = "junit.xml" }

[test-groups]
host-network = { max-threads = 1 }
cluster-heavy = { max-threads = 1 }
process-heavy = { max-threads = 2 }
upgrade-heavy = { max-threads = 1 }
crash-recovery = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(ebpf) | binary(owned_network) | binary(owned_runc) | binary(owned_rootless) | test(/(runc|netns|btrfs|buildah|image_pull)/)'
test-group = "host-network"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary(cluster_failover) | binary(council_self_healing) | binary(council_disaster_recovery) | binary(cluster_gossip) | binary(reporting_tcp)'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary(integration) | binary(placement) | binary(job_recovery)'
test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'binary(self_upgrade) | binary(self_upgrade_cluster)'
test-group = "upgrade-heavy"
slow-timeout = { period = "120s", terminate-after = 3 }

# Node pressure asserts on whole-node memory usage; any concurrently
# running test binary churns that measurement by hundreds of megabytes.
# Reserve every test thread so it runs alone.
[[profile.default.overrides]]
filter = 'binary(node_pressure)'
threads-required = "num-test-threads"

[[profile.ci.overrides]]
filter = 'binary(ebpf) | binary(owned_network) | binary(owned_runc) | binary(owned_rootless) | test(/(runc|netns|btrfs|buildah|image_pull)/)'
test-group = "host-network"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'binary(cluster_failover) | binary(council_self_healing) | binary(council_disaster_recovery) | binary(cluster_gossip) | binary(reporting_tcp)'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'binary(integration) | binary(placement) | binary(job_recovery)'
test-group = "process-heavy"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.ci.overrides]]
filter = 'binary(self_upgrade) | binary(self_upgrade_cluster)'
test-group = "upgrade-heavy"
slow-timeout = { period = "120s", terminate-after = 3 }

# Same exclusivity as the default profile: node pressure measures the
# whole node.
[[profile.ci.overrides]]
filter = 'binary(node_pressure)'
threads-required = "num-test-threads"

# Registry crash acceptance includes an intentional 30-second lease expiry,
# real TLS enrolment and a three-voter election. Serialise the physical cluster
# fixtures and allow their explicit recovery deadlines to run under nextest.
[[profile.default.overrides]]
filter = 'binary(documentation_first_run) & (test(=expired_registry_lease_recovers_after_bun_sigkill_and_preserves_shared_content) | test(=new_leader_retains_registry_cleanup_until_the_killed_writer_returns))'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.ci.overrides]]
filter = 'binary(documentation_first_run) & (test(=expired_registry_lease_recovers_after_bun_sigkill_and_preserves_shared_content) | test(=new_leader_retains_registry_cleanup_until_the_killed_writer_returns))'
test-group = "cluster-heavy"
slow-timeout = { period = "60s", terminate-after = 4 }

# Crash-recovery acceptance kills real Bun and owner processes and reboots
# their kernel state. The cases share runc, bpffs and cgroup roots, so they
# run one at a time, with room for the three-node upgrade case.
[[profile.default.overrides]]
filter = 'binary(oci_crash)'
test-group = "crash-recovery"
slow-timeout = { period = "60s", terminate-after = 4 }

# Crash-recovery acceptance kills real Bun and owner processes and reboots
# their kernel state. The cases share runc, bpffs and cgroup roots, so they
# run one at a time, with room for the three-node upgrade case.
[[profile.ci.overrides]]
filter = 'binary(oci_crash)'
test-group = "crash-recovery"
slow-timeout = { period = "60s", terminate-after = 4 }
