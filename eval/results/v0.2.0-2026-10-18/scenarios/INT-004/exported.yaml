apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - command:
        - ./podinfo
        - --port=9898
        - --port-metrics=9797
        - --level=info
        env:
        - name: PODINFO_UI_MESSAGE
          value: rbeval-backend
        image: ghcr.io/stefanprodan/podinfo@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
        name: backend
        ports:
        - containerPort: 9898
        resources:
          limits:
            cpu: 1000m
            memory: '268435456'
          requests:
            cpu: 100m
            memory: '33554432'
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
  - port: 9898
    targetPort: 9898
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - command:
        - ./podinfo
        - --port=9898
        - --port-metrics=9797
        - --level=info
        - --backend-url=http://backend:9898/echo
        env:
        - name: PODINFO_UI_MESSAGE
          value: rbeval-frontend
        image: ghcr.io/stefanprodan/podinfo@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
        name: frontend
        ports:
        - containerPort: 9898
        resources:
          limits:
            cpu: 1000m
            memory: '268435456'
          requests:
            cpu: 100m
            memory: '33554432'
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  ports:
  - port: 9898
    targetPort: 9898
  selector:
    app: frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
spec:
  rules:
  - host: fixture.rbeval.test
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 9898
        path: /
        pathType: Prefix
