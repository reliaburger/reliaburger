# VIS-002 secrets: the env value is ciphertext from `relish secret encrypt`;
# podinfo's /env shows what the container actually received.
[app.secretprobe]
image = "ghcr.io/stefanprodan/podinfo@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da"
command = ["./podinfo", "--port=9898", "--level=info"]
replicas = 1
port = 9898
cpu = "20m-200m"
memory = "16Mi-64Mi"

[app.secretprobe.env]
RBEVAL_SECRET = "ENC[AGE:]"

[app.secretprobe.ingress]
host = "secret.rbeval.test"
path = "/"
