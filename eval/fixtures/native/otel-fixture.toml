# Fixture for EXT-001: podinfo's built-in OpenTelemetry SDK, configured only
# through flags and env vars, exporting to the collector outside the cluster.
[app.otelfix]
image = "ghcr.io/stefanprodan/podinfo@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da"
command = ["./podinfo", "--port=9898", "--level=info", "--otel-service-name=rbeval-otel-fixture"]
replicas = 2
port = 9898
cpu = "100m-1000m"
memory = "32Mi-256Mi"

[app.otelfix.health]
path = "/readyz"

[app.otelfix.env]
OTEL_EXPORTER_OTLP_ENDPOINT = "http://{{COLLECTOR}}:4317"
OTEL_EXPORTER_OTLP_INSECURE = "true"

[app.otelfix.ingress]
host = "otel.rbeval.test"
path = "/"
